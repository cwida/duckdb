module: configuration
#
# Reading and writing config options, and describing them.
#
# A config handle is the scope options are read from and written at: take one
# from an instance (GLOBAL alone), or from a connection or context (that
# client's cascade). config_get_option_value reads the effective value of an
# option and reports the scope it came from; config_set_option_value writes one at a
# given scope. Values are typed: they carry the option's type when read, and
# are cast to it when written, as SQL `SET` does.
#
# Definitions: an option handle is an owned, read-only descriptor of one
# option as registered on the instance: its canonical name, default value,
# description, the scopes it may be written at, and aliases. It carries no
# current value, and is the same from every config of one instance.
# Descriptors come back from the config_get_option_by_name and
# config_get_option_by_index listing functions and are destroyed via
# option_destroy.
#
# Startup options -- those that cannot change once an instance exists -- are
# passed to instance_create instead.
#
# Implementation note: every write delegates to PhysicalSet::SetVariable, so
# SQL `SET` and the V2 C API share one resolution and dispatch path: lock
# check, core-then-extension lookup with autoload, scope target validation,
# value cast, and generic vs legacy apply. See
# src/include/duckdb/execution/operator/helper/physical_set.hpp.
enums:
  SETTING_SCOPE:
    description: |
      The scope of an option's value. Writes take DEFAULT, GLOBAL or SESSION:
      DEFAULT writes to the option's default scope (`[[option_get_default_scope]]`),
      like SQL `SET name = value`; GLOBAL writes through to the instance, visible to all
      connections, like `SET GLOBAL`; SESSION writes to one connection's session
      only, like `SET SESSION`. Reads report GLOBAL or SESSION, as DuckDB
      attributes the value: an option no scope sets reads as GLOBAL, its
      default, and a legacy option read through a connection or context reads
      as SESSION.
    values:
      SETTING_SCOPE_DEFAULT:
        value: 0
        description: "Write only: the option's default scope (`[[option_get_default_scope]]`), not its default value."
      SETTING_SCOPE_GLOBAL:
        description: "The instance's value, visible to all connections."
      SETTING_SCOPE_SESSION:
        description: "A connection's session value."
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Where a config comes from
  #---------------------------------------------------------------------------------------------------------------------
  instance_get_config:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Borrows the config of an instance: the GLOBAL scope.

      Reads report GLOBAL, and writes are `SET GLOBAL`. Writing at SESSION
      scope returns ERROR_INPUT_INVALID: an instance has no session. Options
      that can only be chosen at startup are passed to `[[instance_create_with_options]]`.
      The returned handle is borrowed: it is valid for as long as the instance
      is, and must not be destroyed.
    role: getter
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: "The instance."
      out_config:
        type: config
        indirection: 1
        kind: OUT
        description: "Receives the borrowed config."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  connection_get_config:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Borrows the config of a connection.

      Reads follow the connection's cascade: its SESSION value if it set one,
      otherwise the GLOBAL value, otherwise the default. Writes accept any
      scope the option supports. The returned handle is borrowed: it is valid
      for as long as the connection is, and must not be destroyed.
    role: getter
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: "The connection."
      out_config:
        type: config
        indirection: 1
        kind: OUT
        description: "Receives the borrowed config."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  context_get_config:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Borrows the config of a context.

      The same scope `[[connection_get_config]]` gives for the context's
      connection. The returned handle is borrowed: it is valid for as long as
      the context is, and must not be destroyed.
    role: getter
    belongs_to: context
    parameters:
      ctx:
        type: context
        description: "The context."
      out_config:
        type: config
        indirection: 1
        kind: OUT
        description: "Receives the borrowed config."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Values
  #---------------------------------------------------------------------------------------------------------------------
  config_get_option_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Reads the effective value of an option in this config, and the scope it
      came from.

      Aliases resolve transparently, and an unknown name returns
      ERROR_INPUT_INVALID. The caller destroys the returned value.
    role: getter
    belongs_to: config
    parameters:
      config:
        type: config
        description: "The config to read from."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the value, typed as the option. Owned by the caller."
      out_scope:
        type: SETTING_SCOPE
        indirection: 1
        kind: OUT
        description: "Receives the scope the value came from."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  config_set_option_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Writes an option in this config.

      `scope` chooses the destination, mirroring SQL:
        - DEFAULT writes to the option's default scope, like a bare
          `SET name = value`.
        - GLOBAL writes through to the instance, visible to all connections,
          like `SET GLOBAL`.
        - SESSION writes to one connection's session only, like `SET SESSION`.
      A scope neither the option (`[[option_supports_scope]]`) nor the config
      supports returns ERROR_INPUT_INVALID; an instance's config supports only
      GLOBAL. The value is cast to the option's type as SQL `SET` does. An
      unknown name is rejected unless an extension that defines it can be
      autoloaded. An option that can only be chosen at startup is rejected:
      pass it to `[[instance_create_with_options]]`.
    role: setter
    belongs_to: config
    parameters:
      config:
        type: config
        description: "The config to write to."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      value:
        type: value
        description: "The value, cast to the option's type as SQL `SET` does. Borrowed."
      scope:
        type: SETTING_SCOPE
        description: "Target scope: DEFAULT, GLOBAL, or SESSION."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  config_set_option_text:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Writes an option in this config from text, the form SQL `SET` accepts.

      `[[config_set_option_value]]` with the text as a VARCHAR value: the engine casts
      it to the option's type, so this is the one-call form for a setting
      spelled the way SQL spells it, e.g. "1GB" for memory_limit. Scope
      handling and errors are `[[config_set_option_value]]`'s.
    role: setter
    belongs_to: config
    parameters:
      config:
        type: config
        description: "The config to write to."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      setting:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: "The setting, in the textual form SQL `SET` accepts."
      scope:
        type: SETTING_SCOPE
        description: "Target scope: DEFAULT, GLOBAL, or SESSION."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Definitions
  #---------------------------------------------------------------------------------------------------------------------
  config_get_option_by_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Describes a config option registered on this config's instance, by name.

      Allocates an option descriptor: canonical name, default value,
      description, supported and default scopes, and aliases. Aliases resolve transparently — passing an alias returns the
      canonical option, with the alias listed in its alias array. An unknown
      name returns ERROR_INPUT_INVALID, which includes an option of an
      extension that has not loaded yet. The caller destroys the returned
      option.
    role: getter
    belongs_to: config
    parameters:
      config:
        type: config
        description: "The config whose instance registered the options."
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "Option name (canonical or alias)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the option descriptor."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  config_get_option_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of config options registered on this config's instance.

      Counts core options plus the extension options registered on this
      instance. Aliases are NOT counted separately; each one is reachable
      through its canonical option's alias array.
    role: getter
    belongs_to: config
    parameters:
      config:
        type: config
        description: "The config whose instance registered the options."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the option count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  config_get_option_by_index:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Describes the config option at the given index on this config's instance.

      Index space: [0, core_count) addresses core options, [core_count, total)
      extension options. The mapping is stable for as long as no extension
      registers new options. An out-of-range index returns ERROR_INPUT_INVALID.
      The caller destroys the returned option.
    role: getter
    belongs_to: config
    parameters:
      config:
        type: config
        description: "The config whose instance registered the options."
      index:
        type: idx
        description: "The option index, in [0, option_count)."
      out_option:
        type: option
        indirection: 1
        kind: OUT
        description: "Receives the option descriptor."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys an option descriptor.

      Frees the handle along with the strings it owns. On success the slot is
      set to null. Safe to call on an already-null slot.
    role: destructor
    belongs_to: option
    parameters:
      option:
        type: option
        indirection: 1
        description: "The option handle to destroy."
    return_type: ERROR

  option_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the option's canonical name.

      When the option was resolved from an alias, this still reports the
      canonical name; the alias is reachable via `[[option_get_alias]]`.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the option name. Valid until the option is destroyed."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_default_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the option's static default, as a value of the option's type.

      A NULL value for an option whose declaration has no default. The caller
      destroys the returned value.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: "Receives the default value."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_description:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the option's human-readable description.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_description:
        type: str
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the description. Valid until the option is destroyed."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_supports_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Reports whether the option may be written at a scope.

      GLOBAL and SESSION are the scopes to ask about; DEFAULT is supported by
      every option that supports either. A write at an unsupported scope
      returns ERROR_INPUT_INVALID.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      scope:
        type: SETTING_SCOPE
        description: "The scope to ask about."
      out_supported:
        type: bool
        indirection: 1
        kind: OUT
        description: "Receives whether a write at the scope is accepted."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_default_scope:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-08" ]
    description: |
      Returns the scope a DEFAULT write of the option goes to: GLOBAL or
      SESSION.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_scope:
        type: SETTING_SCOPE
        indirection: 1
        kind: OUT
        description: "Receives the default scope."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_alias_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of aliases registered for this option.

      Zero for an extension option; extension options carry no aliases.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: "Receives the alias count."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  option_get_alias:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the alias name at the given index.

      An out-of-range index returns ERROR_INPUT_INVALID.
    role: getter
    belongs_to: option
    parameters:
      option:
        type: option
        description: "The option."
      index:
        type: idx
        description: "The alias index, in [0, alias_count)."
      out_alias:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: "Receives a borrowed view of the alias. Valid until the option is destroyed."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

