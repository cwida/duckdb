module: sql_statement
#
# Turn a SQL string into individual statements. parse_sql parses and nothing
# more: no binding and no catalog access. The connection supplies the parser
# state — its options and the parser extensions loaded on it — so a statement
# parsed on one connection should be executed on that connection. The caller
# chooses whether a parse error invalidates the connection's active
# transaction, according to the transaction invalidation policy.
# Statements are raw parser output; statement-level rewrites (pragma
# reparsing, statement expansion, transaction wrapping) happen inside
# statement_execute, so one user statement is always one handle.
#
# The iterator yields one owned statement per statement_iterator_next call.
# Passing a statement to statement_execute does not consume it — a copy is
# what runs — so the same statement can be executed again, possibly with a
# different set of parameter values, and the caller always destroys it via
# sql_statement_destroy.
#
# A statement object holds parse-time metadata, including its type, its own
# text, and the names of its parameters. Each has its own getter. For
# properties that need binding, use `[[statement_bind]]`.
#
# A parse error surfaces either from parse_sql, when the implementation parses
# eagerly and so reports it up front and yields no statements, or from the
# statement_iterator_next call that reaches the failing statement, when the
# implementation is incremental and so yields the statements before it.
# Callers must handle both, by checking every return code.

handles:
  sql_statement:
    description: |
      An opaque, owned handle to a single parsed SQL statement, produced by
      statement_iterator_next. statement_execute runs it without consuming it;
      the caller always destroys it via sql_statement_destroy.
    cleanup_with: sql_statement_destroy
  statement_iterator:
    description: |
      An opaque, owned handle to an iterator over the statements of a SQL
      string, produced by parse_sql. Destroy it via statement_iterator_destroy;
      statements it already yielded are independently owned and unaffected.
    cleanup_with: statement_iterator_destroy
enums:
  STATEMENT_TYPE:
    description: |
      SQL statement type of a parsed statement or an executed query.
    values:
      STATEMENT_TYPE_INVALID:
        value: 0
      STATEMENT_TYPE_SELECT:
        value: 1
      STATEMENT_TYPE_INSERT:
        value: 2
      STATEMENT_TYPE_UPDATE:
        value: 3
      STATEMENT_TYPE_CREATE:
        value: 4
      STATEMENT_TYPE_DELETE:
        value: 5
      STATEMENT_TYPE_PREPARE:
        value: 6
      STATEMENT_TYPE_EXECUTE:
        value: 7
      STATEMENT_TYPE_ALTER:
        value: 8
      STATEMENT_TYPE_TRANSACTION:
        value: 9
      STATEMENT_TYPE_COPY:
        value: 10
      STATEMENT_TYPE_ANALYZE:
        value: 11
      STATEMENT_TYPE_VARIABLE_SET:
        value: 12
      STATEMENT_TYPE_CREATE_FUNC:
        value: 13
      STATEMENT_TYPE_EXPLAIN:
        value: 14
      STATEMENT_TYPE_DROP:
        value: 15
      STATEMENT_TYPE_EXPORT:
        value: 16
      STATEMENT_TYPE_PRAGMA:
        value: 17
      STATEMENT_TYPE_VACUUM:
        value: 18
      STATEMENT_TYPE_CALL:
        value: 19
      STATEMENT_TYPE_SET:
        value: 20
      STATEMENT_TYPE_LOAD:
        value: 21
      STATEMENT_TYPE_RELATION:
        value: 22
      STATEMENT_TYPE_EXTENSION:
        value: 23
      STATEMENT_TYPE_LOGICAL_PLAN:
        value: 24
      STATEMENT_TYPE_ATTACH:
        value: 25
      STATEMENT_TYPE_DETACH:
        value: 26
      STATEMENT_TYPE_MULTI:
        value: 27
      STATEMENT_TYPE_COPY_DATABASE:
        value: 28
      STATEMENT_TYPE_UPDATE_EXTENSIONS:
        value: 29
      STATEMENT_TYPE_MERGE_INTO:
        value: 30
      STATEMENT_TYPE_CONNECT:
        value: 31
      STATEMENT_TYPE_DISCONNECT:
        value: 32
      STATEMENT_TYPE_EXTERNAL_RESOURCE:
        value: 33
      STATEMENT_TYPE_PASSTHROUGH:
        value: 34
functions:
  parse_sql:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Parses a SQL string into an iterator over its statements.

      Parses and nothing more: no binding and no catalog access. The connection
      supplies the parser options and parser extensions. With
      apply_invalidation_policy, a parse error invalidates the connection's
      active transaction according to the transaction invalidation policy, like
      an error from running the statement would; pass that when the statements
      are parsed to be run. Without it, a parse error leaves the transaction
      usable, for callers that only inspect the statements, for example with
      `[[statement_bind]]`.
      Statements are raw parser output; statement-level rewrites happen inside
      statement_execute. The SQL string is copied, so the caller may free it
      once this call returns. An input with no statements — empty, whitespace,
      or separators only — yields an iterator that is immediately exhausted.
    role: constructor
    belongs_to: statement_iterator
    parameters:
      conn:
        type: connection
        description: The connection supplying the parser configuration.
      sql:
        type: char
        indirection: 1
        const: true
        description: Null-terminated SQL string; may contain any number of statements.
      apply_invalidation_policy:
        type: bool
        description: Whether a parse error invalidates the active transaction, according to the transaction invalidation policy.
      out_iterator:
        type: statement_iterator
        indirection: 1
        kind: OUT
        description: Receives the new iterator handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  statement_iterator_next:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Yields the next statement, or NULL when exhausted.

      On success *out_statement receives the next owned statement, or NULL once
      the iterator is exhausted — repeatedly, so calling again is harmless. A
      parse error within the input surfaces no later than the call that reaches
      the failing statement: an implementation that parses eagerly reports it
      from parse_sql instead and yields no statements at all, while an
      incremental one yields the statements ahead of the failure first. On
      failure *out_statement is set to NULL.
    role: method
    belongs_to: statement_iterator
    parameters:
      iterator:
        type: statement_iterator
        description: The iterator to advance.
      out_statement:
        type: sql_statement
        indirection: 1
        kind: OUT
        description: Receives an owned statement, or NULL when the iterator is exhausted.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  statement_bind:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Binds a parsed statement without executing, yielding its schema signature.

      Preprocesses and binds the statement exactly as execution would, but runs
      nothing: the result is the statement's signature as two schemas, not a
      query result. The statement is borrowed, not consumed, so it can be bound
      as often as you like and executed later. out_schema receives the output
      schema (result columns) and is never empty, since a non-SELECT reports a
      single status column: a BIGINT changed-rows count, or a BOOLEAN success.
      out_parameters, when non-NULL, receives the input schema (parameter
      types, ordered by binding index). Both are owned; destroy them via
      schema_destroy.

      Binding is read-only and does not disturb a live result: it begins no
      query, claims no cursor, reuses an active transaction read-only, and runs
      alongside a paused stream. It is single-consumer like the stepping
      functions, so bind concurrently only on a second connection.
      Prepare-time errors — binder, catalog, preprocessing — surface here. A
      statement that expands into a group (a dynamic PIVOT, or
      statement-expanding DDL such as ALTER ADD COLUMN with a non-constant
      DEFAULT) has a schema known only at execution, and is reported with
      ERROR_INPUT_METADATA_DEFERRED; execute it instead.

      *out_schema and *out_parameters are set to NULL on failure.
    role: method
    belongs_to: sql_statement
    parameters:
      conn:
        type: connection
        description: The connection supplying the catalog, transaction, and parser configuration.
      statement:
        type: sql_statement
        description: The statement to bind. Borrowed; not consumed.
      out_schema:
        type: schema
        indirection: 1
        kind: OUT
        description: Receives the owned output schema (result columns). Destroy via schema_destroy.
      out_parameters:
        type: schema
        indirection: 1
        kind: OUT
        description: Optional. When non-NULL, receives the owned input schema (parameter types, ordered by binding index). Destroy via schema_destroy.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  statement_add_collection:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-12" ]
    description: |
      Binds a column data collection to the statement under a name.

      Makes the collection visible to the statement as a table named `name`, by adding a common table expression to
      the parsed statement. The statement can then be bound, prepared or executed as usual; each execution reads the
      collection's contents at that moment, so a prepared statement can be executed again after the collection was
      cleared and refilled. Supported statement types are SELECT, INSERT, UPDATE, DELETE and MERGE INTO; any other
      type is rejected with `ERROR_INPUT_INVALID`.

      A name the statement already defines as a common table expression, in its SQL text or by a prior call, is
      rejected with `ERROR_INPUT_INVALID`. The binding shadows any catalog table named `name`, as a common table
      expression does.

      By default the collection's columns are named col1..colN. Pass `column_names` to name them instead; when
      supplied, `column_count` must equal the collection's column count. Pass NULL and 0 for the default names.

      The collection is borrowed: the caller keeps ownership and must keep it alive, and must not clear, reset or
      destroy it, for as long as the statement, any statement copied or prepared from it, or any result executing it
      is live. An empty collection is a valid binding. Several collections can be bound under distinct names.
    role: method
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement to bind the collection to. Modified in place.
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: The non-empty name the statement refers to the collection by. Borrowed and copied.
      collection:
        type: column_data_collection
        description: The collection to bind. Borrowed; the caller keeps ownership and must keep it alive.
      column_names:
        type: identifier
        indirection: 1
        const: true
        description: Optional. An array of `column_count` names for the collection's columns, in order. Pass NULL for col1..colN.
      column_count:
        type: idx
        description: The number of names in `column_names`. 0 for the default names; otherwise the collection's column count.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  sql_statement_get_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-11" ]
    description: |
      Returns the statement's type as classified by the parser.

      This gives the type before the statement-level rewrites that
      `[[statement_execute]]` applies, if any. So a PRAGMA reports PRAGMA even
      where execution rewrites it into a SELECT or a CALL.
      `[[result_get_statement_type]]` on the executed result reports the
      rewritten type of a statement that rewrites into one. A statement the
      parser expands into a group reports MULTI, here and on its result. Its
      parts are not visible here, and statement_bind reports
      ERROR_INPUT_METADATA_DEFERRED for it.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      out_type:
        type: STATEMENT_TYPE
        indirection: 1
        kind: OUT
        description: Receives the statement type.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_get_text:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-11" ]
    description: |
      Borrows the statement's own SQL text.

      The slice of the parsed string that belongs to this statement. A
      trailing terminator and the whitespace after it are included, whitespace
      and comments before the first token are not. The statement holds its own
      copy, so the view outlives the SQL string passed to parse_sql and the
      iterator, and stays valid until the statement is destroyed. A statement
      produced by a parser extension that overrides parsing carries whatever
      text the extension recorded.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      out_text:
        type: str
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the statement text, valid until the statement is destroyed.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_get_parameter_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-11" ]
    description: |
      Returns the number of distinct parameters the statement declares.

      This counts the parameters the parser found ($1, ?, $name, ...), so it
      needs no catalog and no binding; only the parameter types wait for
      `[[statement_bind]]`. Repeated uses of one parameter count once.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of distinct parameters.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_get_parameter_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-11" ]
    description: |
      Borrows the name of one parameter, in binding order.

      Parse-time metadata. Positions follow the parameters' binding indices,
      the order of `[[statement_bind]]`'s parameter schema, so position i here
      names field i there. The name is the binding key that
      `[[statement_execute]]` accepts: "1", "2", ... for a positional parameter
      ($1 or ?), the identifier for a named one ($name). Positional indices may
      be gapped ($1 and $3 without $2), in which case the names are "1" and "3"
      at positions 0 and 1. The view is valid until the statement is destroyed.
      An index outside [0, count) is rejected with ERROR_INPUT_OUT_OF_RANGE.
    role: getter
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        description: The statement.
      index:
        type: idx
        description: Zero-based position in binding order.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the parameter name, valid until the statement is destroyed.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  sql_statement_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a statement handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a no-op.
      statement_execute does not consume a statement, so every statement is
      destroyed here once it is no longer needed. On success the slot is set to
      nullptr.
    role: destructor
    belongs_to: sql_statement
    parameters:
      statement:
        type: sql_statement
        indirection: 1
        description: The statement to destroy.
    return_type: ERROR

  statement_iterator_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a statement iterator handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a no-op.
      Statements already yielded are independently owned and stay valid. On
      success the slot is set to nullptr.
    role: destructor
    belongs_to: statement_iterator
    parameters:
      iterator:
        type: statement_iterator
        indirection: 1
        description: The iterator to destroy.
    return_type: ERROR
