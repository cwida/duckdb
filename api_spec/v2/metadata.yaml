schema_version: "0.7"
versions:
  - "v2.0.0"
prefix: "duckdb_v2_"
lifecycle_states:
  stable:
    visibility: always
  deprecated:
    visibility: opt_out
    guard: DUCKDB_API_NO_DEPRECATED
  unstable:
    visibility: opt_in
    guard: DUCKDB_EXTENSION_API_VERSION_UNSTABLE
suffixes:
  handles: "_handle"
  callbacks: "_fn"
  aliases: "_t"
primitives:
  - name: void
    c_type: void
  - name: char
    c_type: char
  - name: bool
    c_type: bool
  - name: i8
    c_type: int8_t
  - name: i16
    c_type: int16_t
  - name: i32
    c_type: int32_t
  - name: i64
    c_type: int64_t
  - name: u8
    c_type: uint8_t
  - name: u16
    c_type: uint16_t
  - name: u32
    c_type: uint32_t
  - name: u64
    c_type: uint64_t
  - name: f32
    c_type: float
  - name: f64
    c_type: double
  - name: idx
    c_type: idx_t
    underlying: uint64_t
  - name: size
    c_type: size_t
  # The extension currently being loaded: the identity under which catalog
  # entries (functions, types, casts) and database-level hooks (replacement
  # scans, log storages) are installed, and the only way to register those
  # objects from inside DuckDB. Registrations through it run on the database's
  # system transaction and are attributed to the extension. Borrowed for the
  # duration of an extension's load; never destroyed by the caller. The
  # underlying spells the loader's token type: the handle IS the token passed
  # to the C extension entrypoint (function types must match exactly at the
  # loader's indirect call sites under -fsanitize=function).
  - name: extension
    c_type: duckdb_v2_extension_handle
    underlying: struct _duckdb_extension_info *
  # Arrow C Data Interface structs. Declared as primitives so the arrow module
  # can reference them by their upstream names (e.g. `struct ArrowSchema *`).
  # They carry no `underlying`, so no typedef is emitted; the full struct
  # definitions come from the header preamble (emit_arrow_defs above).
  - name: ArrowSchema
    c_type: struct ArrowSchema
  - name: ArrowArray
    c_type: struct ArrowArray
  - name: ArrowArrayStream
    c_type: struct ArrowArrayStream
