module: data_chunk
#
# Construct and inspect data chunks.
#
# A chunk is a set of vectors of equal logical length plus a row-count
# cardinality. It does not carry types: the column types of a streamed chunk
# come from the producing result's schema (result_get_schema, in the
# query_result module).
#
# Chunks produced by a streaming result (result_step / result_fetch_chunk, in
# the query_result module) are caller-owned and must be destroyed via
# data_chunk_destroy. Vectors borrowed with data_chunk_get_vector stay valid
# for the lifetime of the chunk and are read via vector_get_view. The row count
# for top-level vectors is data_chunk_get_size; it lives on the chunk, not on
# the view. Nested children take their row count from the parent's geometry
# instead; see vector.yaml.

functions:
  # -----------------------------------------------------------------------
  # DataChunk construction
  # -----------------------------------------------------------------------
  data_chunk_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates an empty data chunk with the given column types, drawing its allocator from a factory.

      The chunk's vectors are allocated through the factory's database, so the
      memory is accounted to that database. Allocates one FLAT vector per element of the
      types array, each at default capacity. Every vector starts at size 0; set
      it with vector_set_size once the vector is populated. The chunk is
      caller-owned and must be destroyed via data_chunk_destroy.
    role: constructor
    belongs_to: data_chunk
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      types:
        type: logical_type
        indirection: 1
        const: true
        description: Pointer to an array of logical_type handles, one per column.
      column_count:
        type: idx
        description: Number of elements in the types array.
      out_chunk:
        type: data_chunk
        indirection: 1
        kind: OUT
        description: Receives the new chunk handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  data_chunk_copy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a deep copy of a data chunk, drawing its allocator from a factory.

      Allocates a new chunk with the source chunk's column types and copies all rows into it, through the factory's database. The copy is flattened and owns all its data, so it stays valid after the source chunk or whatever backs it (such as a column data collection scan state) is destroyed. The returned chunk is caller-owned and must be destroyed via data_chunk_destroy.
    role: constructor
    belongs_to: data_chunk
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      chunk:
        type: data_chunk
        description: The chunk to copy. Left unchanged.
      out_chunk:
        type: data_chunk
        indirection: 1
        kind: OUT
        description: Receives the new chunk handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # Chunk-level accessors
  # -----------------------------------------------------------------------
  data_chunk_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a data chunk handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a no-op.
      On success the slot is set to nullptr. Any vector previously borrowed
      from this chunk becomes invalid.
    role: destructor
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        indirection: 1
        description: The chunk to destroy.
    return_type: ERROR

  data_chunk_clear:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-12" ]
    description: |
      Empties a data chunk so it can be filled again.

      The chunk's size becomes 0, and each of its vectors becomes a writable FLAT vector of its type again, as on
      creation, so a chunk can be reused for one batch after another instead of being created for each. Data, views
      and pointers taken from the chunk or its vectors beforehand do not survive this. Must not be called on a chunk
      DuckDB lends to a callback for reading.
    role: method
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        description: The chunk to clear.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  data_chunk_get_size:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: Returns the row count of a data chunk.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        description: The chunk.
      out_size:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the row count.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  data_chunk_get_capacity:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Returns the number of rows a data chunk can hold, e.g. how many rows the exec callback of a table function may
      write into its output chunk in one call.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        description: The chunk.
      out_capacity:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of rows the chunk can hold.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  data_chunk_get_vector_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of vectors in a data chunk.

      Equals the column count of the producing result.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        description: The chunk.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the vector count.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  data_chunk_get_vector:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the vector at the given index in a data chunk.

      The returned handle is borrowed and valid until the chunk is destroyed;
      do not destroy it. An out-of-range index returns ERROR_INPUT_INVALID.
    role: getter
    belongs_to: data_chunk
    parameters:
      chunk:
        type: data_chunk
        description: The chunk.
      index:
        type: idx
        description: The vector index, in [0, vector_count).
      out_vector:
        type: vector
        indirection: 1
        kind: OUT_BORROW
        description: Receives the borrowed vector handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
