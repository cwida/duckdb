module: aggregate
#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  aggregate_function:
    description: |
      An owned opaque handle to a custom aggregate function being built. Created with
      `[[aggregate_function_create]]`, configured with
      the setter functions (e.g. `[[aggregate_function_set_name]]`, `[[aggregate_function_set_update_callback]]`, etc.)
      and the signature obtained via `[[aggregate_function_get_signature]]`, made available with
      `[[connection_register_aggregate_function]]` or `[[extension_register_aggregate_function]]`, and destroyed with `[[aggregate_function_destroy]]`.

  aggregate_function_bind_info:
    description: |
      A borrowed opaque handle to the result of an aggregate function's "bind" phase. The "bind" callback receives
      this handle next to a `[[function_bind_info]]`, which gives access to the arguments, the user data and the
      bind data, and can use it to set the return type of the call site being bound.

  aggregate_function_stats_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the "stats" phase of query
      optimization. The "stats" callback receives this handle and can use it to read the statistics of the arguments
      of the call site and narrow the statistics of its result.

  aggregate_function_size_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the state sizing "size"
      phase. The "size" callback receives this handle and must use it to report the size of a single aggregate
      state in bytes.

  aggregate_function_init_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the state
      initialization "init" phase. The "init" callback receives this handle and can use it to access the array
      of aggregate states it must initialize in place.

  aggregate_function_update_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the "update" phase.
      The "update" callback receives this handle and can use it to access the input argument vectors, the
      number of rows to process, and the aggregate state each row must be aggregated into.

  aggregate_function_combine_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the "combine" phase.
      The "combine" callback receives this handle and can use it to access the source and target aggregate
      state arrays to merge.

  aggregate_function_finalize_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the "finalize" phase.
      The "finalize" callback receives this handle and can use it to access the aggregate states and the result
      vector and offset to write their final values to.

  aggregate_function_destroy_info:
    description: |
      A borrowed opaque handle to the arguments supplied to an aggregate function during the state destruction
      "destroy" phase. The "destroy" callback receives this handle and can use it to access the array of
      aggregate states whose resources must be released.
#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  aggregate_function_bind_callback:
    parameters:
      info:
        type: function_bind_info
        description: |
          Borrowed opaque handle providing access to the arguments of the call site being bound, the user data and
          the bind data.
      result:
        type: aggregate_function_bind_info
        description: Borrowed opaque handle to set the return type of the call site being bound through.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_stats_callback:
    parameters:
      info:
        type: aggregate_function_stats_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_size_callback:
    parameters:
      info:
        type: aggregate_function_size_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_init_callback:
    parameters:
      info:
        type: aggregate_function_init_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_update_callback:
    parameters:
      info:
        type: aggregate_function_update_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_combine_callback:
    parameters:
      info:
        type: aggregate_function_combine_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_finalize_callback:
    parameters:
      info:
        type: aggregate_function_finalize_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  aggregate_function_destroy_callback:
    parameters:
      info:
        type: aggregate_function_destroy_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback. Errors reported by this callback are ignored.
    return_type: void
#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Creates a new aggregate function through a factory.

      The function starts out empty: configure it with the setter functions (e.g. `[[aggregate_function_set_name]]`,
      `[[aggregate_function_set_update_callback]]`, etc.) and the signature obtained via
      `[[aggregate_function_get_signature]]`, then make it available with `[[connection_register_aggregate_function]]` or `[[extension_register_aggregate_function]]`. The caller owns the returned handle and must destroy it with
      `[[aggregate_function_destroy]]`, also after registration.

      The aggregate function can only be registered on the database the factory belongs to.
    role: constructor
    belongs_to: aggregate_function
    parameters:
      factory:
        type: factory
        description: The factory to create the aggregate function through.
      function:
        type: aggregate_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created aggregate function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the name of the aggregate function.

      The name is borrowed and copied. Calling this again replaces the previous name.
      A name must be set before registration.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the name of.
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  aggregate_function_get_docs:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-09" ]
    description: |
      Returns the documentation of the function so it can be filled in.

      Set a description with `[[function_docs_set_description]]`, and add examples and categories with
      `[[function_docs_add_example]]` and `[[function_docs_add_category]]`. The documentation is modified in place, describes this overload only, and is
      registered with the function. Optional.
    parameters:
      function:
        type: aggregate_function
        kind: IN
        description: The function to get the documentation of.
      docs:
        type: function_docs
        indirection: 1
        kind: OUT
        description: The returned documentation. Borrowed and valid for the lifetime of the function handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_get_signature:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Returns the function's signature so it can be configured.

      Add parameters with `[[function_signature_add_parameter]]` and set the return type with
      `[[function_signature_set_return_type]]`.
      The signature is modified in place; the function must be given a signature with a return type before
      registration.
    parameters:
      function:
        type: aggregate_function
        kind: IN
        description: The function to get the signature of.
      sig:
        type: function_signature
        indirection: 1
        kind: OUT
        description: The returned signature. Borrowed and valid for the lifetime of the function handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets arbitrary user data on the aggregate function.

      Associates an opaque pointer with the function, retrievable from each callback via its user data accessor
      (e.g. `[[function_bind_get_user_data]]`, `[[aggregate_function_update_get_user_data]]`, etc.).
      The opaque handle bundles the pointer with an optional destructor, invoked when the data is no longer
      needed.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_property:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-31" ]
    description: |
      Sets a property on the aggregate function.

      Configures a function property that influences planning and execution, such as stability, NULL handling,
      fallibility, collation handling, or the aggregate-specific order/DISTINCT dependence. The value must be
      one of the `[[FUNCTION_PROPERTY_VALUE]]` entries belonging to `key`; passing a value that does not belong
      to the key, or a key that is not valid for aggregate functions, results in an error.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the property of.
      key:
        type: FUNCTION_PROPERTY_KEY
        description: The property to set.
      value:
        type: FUNCTION_PROPERTY_VALUE
        description: The value to set for the property. Must belong to `key`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_bind_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the optional bind callback of the aggregate function.

      The bind callback is invoked during query planning for each call site of the function. Through its
      `[[function_bind_info]]` it can inspect the argument types and constant argument values and set "bind data"
      that is shared with the other callbacks. Through its `[[aggregate_function_bind_info]]` it can set a concrete
      return type.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the bind callback of.
      callback:
        type: aggregate_function_bind_callback
        description: The bind callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_size_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the size callback of the aggregate function.

      The size callback reports the size of a single aggregate state in bytes via
      `[[aggregate_function_size_set_state_size]]`; DuckDB uses it to allocate state memory.
      A size callback must be set before registration.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the size callback of.
      callback:
        type: aggregate_function_size_callback
        description: The size callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_init_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the init callback of the aggregate function.

      The init callback initializes freshly allocated aggregate states in place, obtained via
      `[[aggregate_function_init_get_states]]`. An init callback must be set before registration.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the init callback of.
      callback:
        type: aggregate_function_init_callback
        description: The init callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_update_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the update callback of the aggregate function.

      The update callback is invoked during query execution with a batch of input rows: row i of every argument
      vector must be aggregated into state i of the state array. An update callback must be set before
      registration.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the update callback of.
      callback:
        type: aggregate_function_update_callback
        description: The update callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_combine_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the combine callback of the aggregate function.

      The combine callback merges partial aggregate states computed in parallel: source state i must be
      combined into target state i. A combine callback must be set before registration.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the combine callback of.
      callback:
        type: aggregate_function_combine_callback
        description: The combine callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_finalize_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the finalize callback of the aggregate function.

      The finalize callback produces the function's result: state i must be finalized into result row
      offset + i of the result vector. A finalize callback must be set before registration.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the finalize callback of.
      callback:
        type: aggregate_function_finalize_callback
        description: The finalize callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_destroy_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the destroy callback for the aggregate function. Optional: only
      needed when aggregate states own resources that must be released. The
      callback runs on states that are discarded without being finalized; it
      must not fail, an error reported through its error slot is ignored.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the destroy callback of.
      callback:
        type: aggregate_function_destroy_callback
        description: The destroy callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_set_stats_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets the optional stats callback of the aggregate function.

      The stats callback is invoked during query optimization for each call site of the function, after it has been
      bound. Through its `[[aggregate_function_stats_info]]` it reads the statistics of the arguments and narrows the
      statistics of the result, which the engine then uses to simplify the query. A function without a stats callback
      gives the engine no statistics for its result.
    parameters:
      function:
        type: aggregate_function
        description: The function to set the stats callback of.
      callback:
        type: aggregate_function_stats_callback
        description: The stats callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Bind Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_bind_set_return_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the concrete return type of the call site being bound.

      Overrides the return type declared in the signature. Register the function with an ANY return type and set
      the concrete type here, derived from the argument types, to build a function whose result type depends on
      its input. The type is borrowed and copied.
    parameters:
      info:
        type: aggregate_function_bind_info
        description: The bind info handle.
      return_type:
        type: logical_type
        description: The return type to set. Borrowed for the call only.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Size Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_size_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: Retrieves the user data set via `[[aggregate_function_set_user_data]]`.
    parameters:
      info:
        type: aggregate_function_size_info
        description: The size info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_size_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: aggregate_function_size_info
        description: The size info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_size_set_state_size:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Sets the size of a single aggregate state, in bytes. The size callback
      must set this; DuckDB uses it to allocate state memory.
    parameters:
      info:
        type: aggregate_function_size_info
        description: The size info handle.
      size:
        type: idx
        description: The size of a single aggregate state, in bytes.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Init Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_init_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: Retrieves the user data set via `[[aggregate_function_set_user_data]]`.
    parameters:
      info:
        type: aggregate_function_init_info
        description: The init info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_init_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: aggregate_function_init_info
        description: The init info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_init_get_state_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Returns how many aggregate states this invocation must initialize.
      This is the length of the array returned by
      `[[aggregate_function_init_get_states]]`.
    parameters:
      info:
        type: aggregate_function_init_info
        description: The init info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of states.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_init_get_states:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Returns the array of aggregate states to initialize, one pointer per
      state. Each state points to uninitialized memory of the size reported by
      the size callback; the init callback must initialize all of them in
      place.
    parameters:
      info:
        type: aggregate_function_init_info
        description: The init info handle.
      states:
        type: void
        indirection: 3
        kind: OUT
        description: Receives the array of aggregate state pointers. Borrowed; valid only for the duration of the callback.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Update Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_update_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: Retrieves the user data set via `[[aggregate_function_set_user_data]]`.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_update_get_bind_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: Retrieves the bind data set by the function's bind callback.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the bind data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_update_get_row_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Returns how many input rows this invocation carries. This is the length
      of the argument vectors and of the state array: row i of every argument
      vector must be aggregated into state i.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of rows.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_update_get_arg_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Returns how many argument vectors this invocation carries, split into the four parts of the argument list.

      The parts and their order are those the bind callback saw through `[[function_bind_get_arg_count]]`, and the
      vectors are at the same indices. Valid indices for `[[aggregate_function_update_get_arg]]` are [0, the sum of the four
      counts). Every out-parameter may be NULL, in which case nothing is written to it.
    parameters:
      info:
        type: aggregate_function_update_info
        description: The update info handle.
      positional_fixed:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the number of positional-only and standard parameters.
      positional_variadic:
