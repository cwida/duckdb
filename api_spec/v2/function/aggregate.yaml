  aggregate_function_stats_get_arg_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Returns how many arguments the call site has, split into the four parts of the argument list.

      The parts and their order are those the bind callback saw through `[[function_bind_get_arg_count]]`, and the
      arguments are at the same indices. Valid indices for `[[aggregate_function_stats_get_arg_stats]]` are [0, the sum of
      the four counts). Every out-parameter may be NULL, in which case nothing is written to it.
    parameters:
      info:
        type: aggregate_function_stats_info
        description: The stats info handle.
      positional_fixed:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the number of positional-only and standard parameters.
      positional_variadic:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the number of arguments `*args` received, 0 when the signature has none.
      named_fixed:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the number of named-only parameters.
      named_variadic:
        type: idx
        indirection: 1
        kind: OUT
        description: Optional. Receives the number of arguments `**kwargs` received, 0 when the signature has none.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  aggregate_function_stats_get_arg_stats:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Retrieves the statistics of the argument at the given index.

      The index is the one the bind callback used for the argument. The statistics are read-only. Fails if the index
      is out of bounds. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: aggregate_function_stats_info
        description: The stats info handle.
      index:
        type: idx
        description: The index of the argument.
      stats:
        type: stats
        indirection: 1
        kind: OUT
        description: Receives the borrowed, read-only statistics of the argument.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  aggregate_function_stats_get_result_stats:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Retrieves the statistics of the call site's result, for the callback to narrow.

      The statistics start out unknown, with every kind of value possible. They describe every result the
      aggregate produces, including the result of a group with no input rows, such as an ungrouped aggregate over
      an empty table. Borrowed; valid only for the duration of the callback.
    parameters:
      info:
        type: aggregate_function_stats_info
        description: The stats info handle.
      stats:
        type: stats
        indirection: 1
        kind: OUT
        description: Receives the borrowed, writable statistics of the call site's result.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  #---------------------------------------------------------------------------------------------------------------------
  # Register
  #---------------------------------------------------------------------------------------------------------------------
  connection_register_aggregate_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Registers the aggregate function, making it available for use in SQL queries.

      The function is registered on the connection's database, visible to every connection, in the connection's
      transaction: inside an explicit transaction, it is invisible to other connections until the transaction commits,
      and a rollback undoes it. Registration requires a name, the size, init, update, combine and finalize callbacks,
      and a signature with a complete return type; an ANY return type is accepted only together with a bind callback
      that sets the concrete type per call site. The aggregate function must have been created through a factory of the
      same database. The caller still owns the handle after registration and must destroy it with
      `[[aggregate_function_destroy]]`, which does not affect the registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: aggregate_function
        description: The aggregate function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  extension_register_aggregate_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Registers the aggregate function, making it available for use in SQL queries.

      The function is registered on the loading extension's database and attributed to the extension. Use this from the
      extension's load callback. Registration requires a name, the size, init, update, combine and finalize callbacks,
      and a signature with a complete return type; an ANY return type is accepted only together with a bind callback
      that sets the concrete type per call site. The aggregate function must have been created through a factory of the
      same database. The caller still owns the handle after registration and must destroy it with
      `[[aggregate_function_destroy]]`, which does not affect the registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: aggregate_function
        description: The aggregate function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  aggregate_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-28" ]
    description: |
      Destroys the aggregate function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after registration does not affect the registered
      function.
    parameters:
      function:
        type: aggregate_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR
