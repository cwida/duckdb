  #---------------------------------------------------------------------------------------------------------------------
  # Register
  #---------------------------------------------------------------------------------------------------------------------
  connection_register_table_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Registers the table function, making it available for use in SQL queries.

      The function is registered on the connection's database, visible to every connection, in the connection's
      transaction: inside an explicit transaction, it is invisible to other connections until the transaction commits,
      and a rollback undoes it. Registration requires a name, a bind callback and an exec callback, and rejects a
      signature that declares a return type, since a table function declares the columns it returns from its bind
      callback. The table function must have been created through a factory of the same database. The caller still owns
      the handle after registration and must destroy it with `[[table_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: table_function
        description: The table function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  extension_register_table_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Registers the table function, making it available for use in SQL queries.

      The function is registered on the loading extension's database and attributed to the extension. Use this from the
      extension's load callback. Registration requires a name, a bind callback and an exec callback, and rejects a
      signature that declares a return type, since a table function declares the columns it returns from its bind
      callback. The table function must have been created through a factory of the same database. The caller still owns
      the handle after registration and must destroy it with `[[table_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: table_function
        description: The table function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Destroy
  #---------------------------------------------------------------------------------------------------------------------
  table_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Destroys the table function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to
      prevent double-destruction. Destroying the handle after registration does not affect the registered
      function.
    parameters:
      function:
        type: table_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Batch claiming
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_claim_batch_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the optional claim batch callback of the table function.

      With a claim batch callback, a scanning thread works through the scan one batch at a time: the callback
      claims the next batch of work (e.g. the next block of a file) for the thread's local state, typically from
      the shared global state, and the exec callback then produces the rows of that batch only, leaving the output
      chunk empty once the batch is exhausted. A batch is claimed before the exec callback first runs on a thread,
      and again whenever the exec callback leaves the output chunk empty; the scan ends for a thread once the claim
      batch callback does not claim a batch.

      Telling the batches apart lets a caller that scans several batches in parallel put their rows back in the order of
      the batches, e.g. a multi-file function registered with `[[connection_register_multi_file_function]]` or
      `[[extension_register_multi_file_function]]` claims the batches of the function itself, so that the rows of a file
      keep their order also when several threads scan it.

      The callback runs while the work of the scan is handed out to the threads, possibly while every other
      scanning thread waits for it. It should therefore only claim the work - e.g. reserve the number of the next
      block - and leave reading it to the exec callback.
    parameters:
      function:
        type: table_function
        description: The function to set the claim batch callback of.
      callback:
        type: table_function_claim_batch_callback
        description: The claim batch callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_claim_batch_get_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: Retrieves the user data set on the table function via `[[table_function_set_user_data]]`.
    parameters:
      info:
        type: table_function_claim_batch_info
        description: The claim batch info handle.
      data:
        type: void
        indirection: 2
        kind: OUT
        description: Receives the user data pointer, or null if none was set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_claim_batch_get_bind_data:
