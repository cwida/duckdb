  table_function_get_bind_info_set_column_identifier:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: |
      Attaches an identifier to a result column of the bound call, or to a field nested inside one.

      A multi-file reader can then map the columns of every file onto the columns of its scan by identifier rather
      than by name - e.g. by the field ids of a file format that carries them, so that renamed columns and fields are
      still found. An identifier is an INTEGER field id or a VARCHAR name.

      The nested field is addressed by a path of child indexes, starting at the result column at `column_index`: a
      STRUCT field by its index, the elements of a LIST or ARRAY by `0`, the keys of a MAP by `0` and its values by
      `1`, and a UNION member by its index. An empty path addresses the result column itself. Setting an identifier
      again for the same column or field replaces it. Fails with `ERROR_INPUT_INVALID` when the column index is out
      of range, or the path does not address a nested field of the column's type.
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: The get bind info handle.
      column_index:
        type: idx
        description: The index of the result column, in the order the bind callback declared the columns.
      child_path:
        type: idx
        indirection: 1
        const: true
        description: The path of child indexes addressing the nested field, or null for the column itself.
      child_path_length:
        type: idx
        description: The number of entries in the path, 0 for the column itself.
      identifier:
        type: value
        description: The identifier, an INTEGER or VARCHAR value. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_bind_info_set_option:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-06" ]
    description: |
      Sets an option describing the bound call: a key-value fact about what the call reads, e.g. a property of the
      file it reads. Setting a key again replaces its value.

      A multi-file function registered with `[[connection_register_multi_file_function]]` or
      `[[extension_register_multi_file_function]]` exposes the options of the function it wraps as the metadata of the
      reader of each file, e.g. to a custom multi-file reader of another extension.
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: The get bind info handle.
      key:
        type: str
        indirection: 1
        description: The key of the option. Borrowed and copied.
      value:
        type: value
        description: The value of the option. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Multi-file functions
  #---------------------------------------------------------------------------------------------------------------------
  multi_file_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Creates a new multi-file function through a factory.

      The function starts out empty: give it a name with `[[multi_file_function_set_name]]` and the single-file function
      it wraps with `[[multi_file_function_set_single_file_function]]`, then make it available with
      `[[connection_register_multi_file_function]]` or `[[extension_register_multi_file_function]]`. The caller owns the
      returned handle and must destroy it with `[[multi_file_function_destroy]]`, also after registration.

      The multi-file function can only be registered on the database the factory belongs to.
    role: constructor
    belongs_to: multi_file_function
    parameters:
      factory:
        type: factory
        description: The factory to create the multi-file function through.
      function:
        type: multi_file_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created multi-file function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the name of the multi-file function, as SQL will call it.

      The name is borrowed and copied. Calling this again replaces the previous name. A name must be set before
      registration.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the name of.
      name:
        type: str
        indirection: 1
        description: The name to set. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_single_file_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the name of the table function that reads a single file, which the multi-file function wraps.

      The single-file function must be registered before the multi-file function is, and must take the file to read as
      its only positional parameter, of type ANY. It is bound once for every file that is read, and receives the file
      the way a multi-file function takes one: as the VARCHAR path of the file when there is nothing more to know about
      it, and otherwise as a STRUCT holding the path in its `filename` field and the options to open the file with in
      its other fields - e.g. the size of the file, as a file system reported it while globbing, or the options a caller
      passed along with the file (`read_x([{'filename': 'f.x', 'file_size': 42}])`). Opening the file with those
      options, set with `[[file_open_options_set_value]]`, lets the file system skip work it would otherwise repeat,
      such as asking a remote store for the size of the file. A single-file function that takes a VARCHAR parameter
      instead is still accepted, and only receives the path. Every named parameter the single-file function declares is
      also a named parameter of the multi-file function, forwarded to it as given. Everything that involves several
      files - globbing, lists of files, hive partitioning, the `filename` column, `union_by_name` and the like - is
      provided by the multi-file function on top of it. The name is borrowed and copied. A single-file function must be
      set before registration.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the single-file function of.
      name:
        type: str
        indirection: 1
        description: The name of the registered single-file table function. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_reader_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets how the files the function reads are referred to in messages, e.g. "Avro" or "JSON".

      Optional: without it, the files are referred to by the name of the multi-file function. The name is borrowed
      and copied.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the reader type of.
      reader_type:
        type: str
        indirection: 1
        description: The reader type. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  multi_file_function_set_file_extension:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Sets the file extension of the files the function reads, e.g. "avro".

      Optional. With a file extension, a path that names a directory rather than a file reads the files with that
      extension inside it. Without one, the paths passed to the function must match at least one file. The
      extension is given without a leading dot, and is borrowed and copied.
    parameters:
      function:
        type: multi_file_function
        description: The function to set the file extension of.
      extension:
        type: str
        indirection: 1
        description: The file extension, without a leading dot. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  connection_register_multi_file_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Registers the multi-file function, making it available for use in SQL queries.

      The function is registered on the connection's database, visible to every connection, in the connection's
      transaction: inside an explicit transaction, it is invisible to other connections until the transaction commits,
      and a rollback undoes it. It can then be called with the path of a single file, a glob pattern, or a list of
      either, and accepts the options every multi-file function accepts (e.g. `filename`, `hive_partitioning`,
      `union_by_name`) next to the named parameters of the single-file function. Registration requires a name and a
      single-file function, and fails when no table function by that name is registered or it does not take the path of
      the file to read as its only positional parameter (see `[[multi_file_function_set_single_file_function]]`). The
      multi-file function must have been created through a factory of the same database. The caller still owns the
      handle after registration and must destroy it with `[[multi_file_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: connection
    parameters:
      conn:
        type: connection
        description: The connection to register on.
      function:
        type: multi_file_function
        description: The multi-file function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  extension_register_multi_file_function:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Registers the multi-file function, making it available for use in SQL queries.

      The function is registered on the loading extension's database and attributed to the extension. Use this from the
      extension's load callback. It can then be called with the path of a single file, a glob pattern, or a list of
      either, and accepts the options every multi-file function accepts (e.g. `filename`, `hive_partitioning`,
      `union_by_name`) next to the named parameters of the single-file function. Registration requires a name and a
      single-file function, and fails when no table function by that name is registered or it does not take the path of
      the file to read as its only positional parameter (see `[[multi_file_function_set_single_file_function]]`). The
      multi-file function must have been created through a factory of the same database. The caller still owns the
      handle after registration and must destroy it with `[[multi_file_function_destroy]]`, which does not affect the
      registered function.
    role: method
    belongs_to: extension
    parameters:
      extension:
        type: extension
        description: The loading extension.
      function:
        type: multi_file_function
        description: The multi-file function to register.
      err:
        type: error_info
        indirection: 1
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`."
    return_type: ERROR

  multi_file_function_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-18" ]
    description: |
      Destroys the multi-file function, releasing its resources.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction. Destroying the handle after registration does not affect the registered function.
    parameters:
      function:
        type: multi_file_function
        description: The function to destroy.
        indirection: 1
    return_type: ERROR
