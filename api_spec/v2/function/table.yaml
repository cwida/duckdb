      The result indexes the columns declared with `[[table_function_bind_add_result_column]]`, in declaration
      order. Fails if the index is out of bounds.
    parameters:
      info:
        type: table_function_partition_data_info
        description: The partition data info handle.
      index:
        type: idx
        description: The index of the requested partitioning column.
      column_index:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the index of the declared column.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_partition_data_set_batch_index:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Reports the ordering position of the batch the exec callback just produced.

      Required on every call, whether or not `[[table_function_partition_data_requires_batch_index]]` is
      true: the engine validates the reported value regardless. Not calling this before the callback returns
      fails the query; `0` is always a safe answer when the batch index is not actually required. Must not
      decrease across successive calls on the same thread, must be unique across threads for the ordering to be
      meaningful, must be less than roughly `10^13`, and, when
      partitioning column values are also being reported, must change whenever those values change: the engine
      only re-reads them when the batch index changes, so reporting a new value under an unchanged batch index
      is treated as a caller error rather than applied. Fails with `ERROR_INPUT_INVALID` for an out-of-range
      value; a decreasing value or an unchanged value paired with changed partitioning columns fails the query
      once the callback returns.
    parameters:
      info:
        type: table_function_partition_data_info
        description: The partition data info handle.
      batch_index:
        type: idx
        description: The batch's ordering position.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_partition_data_set_partition_value:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Reports the single value of the partitioning column at the given index, for the batch the exec callback
      just produced.

      Every partition reported this way carries exactly one distinct value for the column, so the value serves
      as both the minimum and maximum of the partition's range. The value is borrowed and copied, and must be
      of the declared type of the corresponding result column. Required once for every index in `[0,
      `[[table_function_partition_data_get_partition_column_count]]`)` before the callback returns; calling
      it again for the same index overwrites the previous value. The reported value only takes effect
      together with a changed `[[table_function_partition_data_set_batch_index]]`: reporting a different
      value under an unchanged batch index fails the query once the callback returns. Fails with
      `ERROR_INPUT_INVALID` when the index is out of bounds or the value's type does not match.
    parameters:
      info:
        type: table_function_partition_data_info
        description: The partition data info handle.
      index:
        type: idx
        description: The index of the partitioning column being reported.
      value:
        type: value
        description: The single value of the partitioning column. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

