        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Constructors
  #---------------------------------------------------------------------------------------------------------------------
  table_function_create:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Creates a new table function through a factory.

      The function starts out empty: configure it with the setter functions (e.g. `[[table_function_set_name]]`,
      `[[table_function_set_exec_callback]]`, etc.) and the signature obtained via `[[table_function_get_signature]]`,
      then make it available with `[[connection_register_table_function]]` or `[[extension_register_table_function]]`.
      The caller owns the returned handle and must destroy it with `[[table_function_destroy]]`, also after
      registration.

      The table function can only be registered on the database the factory belongs to.
    role: constructor
    belongs_to: table_function
    parameters:
      factory:
        type: factory
        description: The factory to create the table function through.
      function:
        type: table_function
        indirection: 1
        kind: OUT
        description: On success, receives the newly created table function. Owned by the caller.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Properties
  #---------------------------------------------------------------------------------------------------------------------
  table_function_set_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the name of the table function.

      The name is borrowed and copied. Calling this again replaces the previous name.
      A name must be set before registration.
    parameters:
      function:
        type: table_function
        description: The function to set the name of.
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: The name to set. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  table_function_get_docs:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-09" ]
    description: |
      Returns the documentation of the function so it can be filled in.

      Set a description with `[[function_docs_set_description]]`, and add examples and categories with
      `[[function_docs_add_example]]` and `[[function_docs_add_category]]`. The documentation is modified in place,
      describes this overload only, and is registered with the function. Optional.
    parameters:
      function:
        type: table_function
        kind: IN
        description: The function to get the documentation of.
      docs:
        type: function_docs
        indirection: 1
        kind: OUT
        description: The returned documentation. Borrowed and valid for the lifetime of the function handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_get_signature:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Returns the function's signature so it can be configured.

      Add parameters with `[[function_signature_add_parameter]]`. The signature is modified in place. A table
      function declares the columns it returns from its bind callback instead of through a return type, so
      registration rejects a signature whose return type was set with `[[function_signature_set_return_type]]`.
    parameters:
      function:
        type: table_function
        kind: IN
        description: The function to get the signature of.
      sig:
        type: function_signature
        indirection: 1
        kind: OUT
        description: The returned signature. Borrowed and valid for the lifetime of the function handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_user_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets arbitrary user data on the table function.

      Associates an opaque pointer with the function, retrievable from the callbacks via
      `[[function_bind_get_user_data]]`, `[[table_function_init_global_get_user_data]]`,
      `[[table_function_exec_get_user_data]]` and their counterparts on the other phases. The opaque handle
      bundles the pointer with an optional destructor, invoked when the data is no longer needed.
    parameters:
      function:
        type: table_function
        description: The function to set the user data of.
      data:
        type: opaque
        indirection: 1
        description: Opaque handle bundling the user data pointer plus an optional destructor.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_bind_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the bind callback of the table function.

      The bind callback is invoked during query planning for each call site of the function. It must declare the
      columns the function returns via `[[table_function_bind_add_result_column]]`. Through its
      `[[function_bind_info]]` it can also inspect the constant argument values and set "bind data" that is shared
      with all later callbacks. A bind callback must be set before registration.
    parameters:
      function:
        type: table_function
        description: The function to set the bind callback of.
      callback:
        type: table_function_bind_callback
        description: The bind callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_init_global_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the optional global init callback of the table function.

      The global init callback is invoked once per scan, at the start of execution. It can set "global state"
      shared by every thread scanning the function, and declare how many threads may scan it in parallel via
      `[[table_function_init_global_set_max_threads]]`.
    parameters:
      function:
        type: table_function
        description: The function to set the global init callback of.
      callback:
        type: table_function_init_global_callback
        description: The global init callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_init_local_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the optional local init callback of the table function.

      The local init callback is invoked once per thread that will scan the function. It can set worker-local
      "local state", retrievable from the exec callback, typically derived from the shared global state.
    parameters:
      function:
        type: table_function
        description: The function to set the local init callback of.
      callback:
        type: table_function_init_local_callback
        description: The local init callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_exec_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the exec callback of the table function.

      The exec callback implements the function's logic: it is invoked repeatedly during query execution and
      writes the next batch of rows to the output chunk, until it produces an empty batch to signal the end of
      the scan. An exec callback must be set before registration.
    parameters:
      function:
        type: table_function
        description: The function to set the exec callback of.
      callback:
        type: table_function_exec_callback
        description: The exec callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_progress_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the optional progress callback of the table function.

      The progress callback is invoked on demand during execution to report how far the scan has advanced, which
      the engine surfaces as the query's progress. It is invoked concurrently with the exec callback, so it must
      read the global state in a thread-safe way.
    parameters:
      function:
        type: table_function
        description: The function to set the progress callback of.
      callback:
        type: table_function_progress_callback
        description: The progress callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR


  table_function_set_projection_pushdown:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Sets whether the table function supports projection pushdown. Defaults to false.

      With projection pushdown, the engine asks the function for only the columns a query actually uses: the exec
      callback's output chunk holds one vector per requested column rather than one per column declared in bind,
      and the global init, local init and exec callbacks can look up which declared column each vector stands for
      via e.g. `[[table_function_exec_get_column_index]]`. Without it the output chunk always holds every declared
      column, and the engine drops the unused ones itself.
    parameters:
      function:
        type: table_function
        description: The function to configure.
      enable:
        type: bool
        description: Whether the function supports projection pushdown.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_filter_pushdown_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-03" ]
    description: |
      Sets the optional filter pushdown callback of the table function.

      The filter pushdown callback is invoked while the query is optimized, after the bind callback and before any
      init callback, with the filter predicates the query applies to the function's rows. Each predicate is a
      bound expression the callback can inspect with the `expression` functions; the callback accepts the
      predicates it will apply itself via `[[table_function_filter_pushdown_accept]]`, typically after
      recording what they select in the bind data. The engine then stops applying the accepted predicates and
      keeps applying the rest above the scan, so accepting a predicate is a promise to filter the rows exactly as
      it would have. The optimizer may invoke the callback more than once for the same query, each time with the
      predicates not yet accepted; it is not invoked when there are none.
    parameters:
      function:
        type: table_function
        description: The function to set the filter pushdown callback of.
      callback:
        type: table_function_filter_pushdown_callback
        description: The filter pushdown callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_partition_data_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Sets the optional "partition data" callback of the table function.

      The callback reports, for the batch the exec callback just produced, an ordering batch index, the values of
      a set of partitioning columns, or both, depending on what a downstream operator requires; it runs on the
      worker thread that produced the batch. Set `[[table_function_set_partitioning_callback]]` too when the
      function can answer partitioning-column requests, since the engine only asks a scan for those when that
      callback reports `TABLE_PARTITION_INFO_SINGLE_VALUE_PARTITIONS`.
    parameters:
      function:
        type: table_function
        description: The function to set the partition data callback of.
      callback:
        type: table_function_partition_data_callback
        description: The partition data callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_partitioning_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-15" ]
    description: |
      Sets the optional "partitioning" callback of the table function.

      The callback tells the query optimizer, for a candidate `GROUP BY` column set, whether every partition the
      scan produces carries exactly one distinct value for those columns; only
      `TABLE_PARTITION_INFO_SINGLE_VALUE_PARTITIONS` unlocks the partitioned aggregate optimization; any other
      result, or leaving this callback unset, keeps the regular hash aggregate. It runs on the planning thread,
      before execution starts, and must be deterministic for a given column set since it may be called on a plan
      the optimizer later discards. Registration fails unless
      `[[table_function_set_partition_data_callback]]` is set too, since the engine asks that callback for the
      partitioning column values once this one claims single-value partitions.
    parameters:
      function:
        type: table_function
        description: The function to set the partitioning callback of.
      callback:
        type: table_function_partitioning_callback
        description: The partitioning callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_set_stats_callback:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets the optional stats callback of the table function.

      The stats callback is invoked during query optimization once for each declared column the query reads. Through
      its `[[table_function_stats_info]]` it narrows the statistics of that column, which the engine then uses to
      simplify the query. A function without a stats callback gives the engine no statistics for its columns.
    parameters:
      function:
        type: table_function
        description: The function to set the stats callback of.
      callback:
        type: table_function_stats_callback
        description: The stats callback to set.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Bind Callback Functions
  #---------------------------------------------------------------------------------------------------------------------
  table_function_bind_add_result_column:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Declares one of the columns the function returns.

      Call this once per column, in order: the columns declared here are the columns of the table the function
      produces, and the vectors of the output chunk the exec callback fills follow the same order. At least one
      column must be declared. The type must be a fully defined concrete type; ANY is rejected, as a result
      column carries data. The name and type are borrowed and copied.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: The name of the column. Borrowed and copied.
      type:
        type: logical_type
        description: The type of the column. Borrowed and copied.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_set_cardinality:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-01" ]
    description: |
      Sets the estimated number of rows the scan will produce.

      The estimate is a hint for the optimizer, not a limit: producing a different number of rows is not an
      error. Without it, the optimizer falls back on its own defaults.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      cardinality:
        type: idx
        description: The estimated number of rows.
      is_exact:
        type: bool
        description: Whether the estimate is exact, which also makes it an upper bound on the row count.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  table_function_bind_set_order_preservation:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-09-28" ]
    description: |
      Sets the order guarantee of the rows this call of the function produces. Defaults to
      `ORDER_PRESERVATION_INSERTION_ORDER`.

      With `ORDER_PRESERVATION_NO_ORDER`, a scan that reports more than one thread via
      `[[table_function_init_global_set_max_threads]]` runs in parallel into query results, INSERT and COPY without
      a `[[table_function_set_partition_data_callback]]`, and the rows arrive in no particular order. With
      insertion order kept, those consumers need the partition data callback to run in parallel. Fails with
      `ERROR_INPUT_INVALID` when order is not one of the enum's declared values.
    parameters:
      info:
        type: table_function_bind_info
        description: The bind info handle.
      order:
        type: ORDER_PRESERVATION
        description: The order guarantee of the produced rows.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

