module: table
#-----------------------------------------------------------------------------------------------------------------------
# Enums
#-----------------------------------------------------------------------------------------------------------------------
enums:
  TABLE_PARTITION_INFO:
    description: |
      Whether a table function's scan is partitioned by a given set of columns, and how. Reported by
      `[[table_function_set_partitioning_callback]]` via `[[table_function_partitioning_set_partition_info]]`.
    values:
      TABLE_PARTITION_INFO_NOT_PARTITIONED:
        value: 0
        description: The scan is not known to be partitioned by the requested columns.
      TABLE_PARTITION_INFO_SINGLE_VALUE_PARTITIONS:
        value: 1
        description: Each partition the scan produces carries exactly one distinct value for the requested columns.
      TABLE_PARTITION_INFO_OVERLAPPING_PARTITIONS:
        value: 2
        description: The partitions the scan produces overlap only at their boundaries.
      TABLE_PARTITION_INFO_DISJOINT_PARTITIONS:
        value: 3
        description: The partitions the scan produces are disjoint ranges.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  table_function:
    description: |
      An owned opaque handle to a custom table function being built. Created with `[[table_function_create]]`,
      configured with the setter functions (e.g. `[[table_function_set_name]]`, `[[table_function_set_exec_callback]]`,
      etc.) and the signature obtained via `[[table_function_get_signature]]`, made available with
      `[[connection_register_table_function]]` or `[[extension_register_table_function]]`, and destroyed with
      `[[table_function_destroy]]`.

  table_function_bind_info:
    description: |
      A borrowed opaque handle to the result of a table function's "bind" phase. The "bind" callback receives this
      handle next to a `[[function_bind_info]]`, which gives access to the arguments, the user data and the bind
      data. It must use this handle to declare the columns the function returns, and can use it to hint at the
      number of rows the scan will produce.

  table_function_init_global_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the global state
      initialization "init global" phase. The "init global" callback receives this handle and can use it to e.g.
      set up the state shared by every thread scanning the function, and to declare how many threads may scan it.

  table_function_init_local_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the local state
      initialization "init local" phase. The "init local" callback receives this handle and can use it to e.g.
      set up worker-local state, typically by claiming work from the shared global state.

  table_function_exec_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the execution "exec" phase.
      The "exec" callback receives this handle and can use it to e.g. access the global and local state and write
      the next batch of rows to the output chunk.

  table_function_progress_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "progress" phase. The
      "progress" callback receives this handle and can use it to report how far the scan has advanced.


  table_function_filter_pushdown_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "filter pushdown" phase of
      query optimization. The "filter pushdown" callback receives this handle and can use it to inspect the filter
      predicates the query applies to the function's rows, and to accept the ones it will apply itself.

  table_function_partition_data_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "partition data" phase.
      The engine invokes the callback on the worker thread that just produced a batch of rows, once per batch, only
      when a downstream operator needs to know the batch's ordering position, the values of a set of partitioning
      columns, or both; the handle reports which of those were actually requested and receives the answer.

  table_function_stats_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "stats" phase of query
      optimization. The engine invokes the callback once per column the query reads, and the callback can use the
      handle to narrow the statistics of that column.

  table_function_partitioning_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function during the "partitioning" phase
      of query optimization. The engine invokes the callback once per candidate `GROUP BY` column set, before
      execution starts, to decide whether the scan can feed a partitioned aggregate directly instead of hashing.

  table_function_claim_batch_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function when a scanning thread claims its
      next batch of work. The "claim batch" callback receives this handle and can use it to claim the next part of
      the scan from the shared global state for the thread's local state, and to report whether it claimed one.

  table_function_get_bind_info_info:
    description: |
      A borrowed opaque handle to the arguments supplied to a table function when the engine asks it to describe a
      bound call. The "get bind info" callback receives this handle, and can use it to describe the call in more
      detail than its columns: with identifiers of its columns (e.g. field ids), and with options - key-value facts
      about what the call reads.

  multi_file_function:
    description: |
      An owned opaque handle to a multi-file table function being built. A multi-file function wraps an already
      registered table function that reads a single file, and adds everything that is needed to read many files at once
      on top of it: globbing, lists of files, hive partitioning, the `filename` column, `union_by_name` and the like.
      Created with `[[multi_file_function_create]]`, configured with the setter functions (e.g.
      `[[multi_file_function_set_name]]`, `[[multi_file_function_set_single_file_function]]`), made available with
      `[[connection_register_multi_file_function]]` or `[[extension_register_multi_file_function]]`, and destroyed with
      `[[multi_file_function_destroy]]`.

#-----------------------------------------------------------------------------------------------------------------------
# Callbacks
#-----------------------------------------------------------------------------------------------------------------------
callbacks:
  table_function_bind_callback:
    parameters:
      info:
        type: function_bind_info
        description: |
          Borrowed opaque handle providing access to the arguments of the call site being bound, the user data and
          the bind data.
      result:
        type: table_function_bind_info
        description: Borrowed opaque handle to declare the result columns and the estimated cardinality of the scan through.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_init_global_callback:
    parameters:
      info:
        type: table_function_init_global_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_init_local_callback:
    parameters:
      info:
        type: table_function_init_local_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_exec_callback:
    parameters:
      info:
        type: table_function_exec_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_progress_callback:
    parameters:
      info:
        type: table_function_progress_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_filter_pushdown_callback:
    parameters:
      info:
        type: table_function_filter_pushdown_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_partition_data_callback:
    parameters:
      info:
        type: table_function_partition_data_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_partitioning_callback:
    parameters:
      info:
        type: table_function_partitioning_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_claim_batch_callback:
    parameters:
      info:
        type: table_function_claim_batch_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query currently executing the callback.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_get_bind_info_callback:
    parameters:
      info:
        type: table_function_get_bind_info_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
        type: context
        description: Borrowed handle to the context of the query the bound call is part of.
      err:
        type: error_info
        indirection: 1
        description: Borrowed error info handle to use to report errors that occur during the callback.
    return_type: void

  table_function_stats_callback:
    parameters:
      info:
        type: table_function_stats_info
        description: Borrowed opaque handle providing access to the information available to the callback.
      context:
