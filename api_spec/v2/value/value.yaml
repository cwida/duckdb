  value_get_decimal:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the value as a DECIMAL: its backing integer plus the width and
      scale of its type.

      The integer is the value scaled by 10^scale — the dual of
      value_create_decimal — widened to 128 bits from whatever storage tier the
      width selects. The integer getters convert, so a DECIMAL read through
      value_get_bigint is its numeric value with the fraction dropped; this one
      always reports storage instead, together with the scale needed to
      interpret it. A value of any other type id, and a NULL value, return
      ERROR_INPUT_INVALID.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out:
        type: hugeint_t
        indirection: 1
        kind: OUT
        description: Receives the backing integer, scaled by 10^scale.
      out_width:
        type: u8
        indirection: 1
        kind: OUT
        description: Receives the total digit count of the value's type.
      out_scale:
        type: u8
        indirection: 1
        kind: OUT
        description: Receives the digits after the decimal point.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

