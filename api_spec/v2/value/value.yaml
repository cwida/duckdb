module: value
#
# Value construction, reading, NULL, composition, descent, and cast.
#
# A value carries a logical type plus a typed payload, stored as:
#   - primitives: an inline union (bool, the integer widths, float/double,
#     hugeint, interval, and every date/time/timestamp variant).
#   - varchar/blob/bit/bignum/geometry: a managed byte string.
#   - type: a managed byte string holding the serialized logical type, which
#     value_create_type wraps and value_get_type unwraps.
#   - composites (list/struct/tuple/map/array/union): a vector of child values,
#     built via value_create (LIST/ARRAY/STRUCT/TUPLE/MAP) or via value_cast
#     (UNION from a member value, ENUM from a VARCHAR), and read via
#     value_get_child_count / value_get_child.
#
# Leaf payloads cross the boundary through the per-kind typed pairs:
# value_create_<kind> builds one, and value_get_<kind> reads one back. The
# constructors take a factory, from an instance, a connection or a callback's
# context; an instance's factory infers types and casts with the built-in rules
# only, without the connection's settings.
# The getters need no scope. A getter reads its own type id directly and converts anything
# else through the default cast set, on a copy, so a read never alters the
# value it reads. Three do not convert: value_get_varchar and value_get_blob
# hand back a pointer into the value, which a converted copy could not outlive,
# and value_get_decimal reports storage rather than a converted number.
#
# The typed set covers the built-ins whose payload is a plain C scalar or byte
# string. Every other kind — ENUM, UNION, VARIANT, extension types — is reached
# through value_cast, which is also how DuckDB itself constructs them: build
# the nearest typed value, usually a VARCHAR, and cast it. VARIANT casts both
# ways, so a boxed cell is read by casting it to the type it carries, or to
# VARCHAR, which always works, and built by casting into it; there is no
# unwrapping getter. BIGNUM reads back through value_get_blob, whose bytes are
# opaque storage — negatives are stored bit-inverted behind a header — and the
# vector module's bignum_encode / bignum_decode translate between those bytes
# and a magnitude plus a sign flag.
#
# All constructors copy their input. Getters return either owned outputs, which
# the caller destroys, or borrowed pointers, valid until the value handle is
# destroyed; each function documents which.
#
# NULL handling: the payload readers (value_get_<kind>, value_get_type) return
# ERROR_INPUT_INVALID for a NULL value, which has no typed payload to hand
# back. Check with value_is_null first, or use value_get_logical_type or
# value_to_string, both of which accept NULL values.

functions:
  # -----------------------------------------------------------------------
  # Lifecycle + NULL
  # -----------------------------------------------------------------------
  value_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a value handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a no-op.
      On success the slot is set to nullptr.
    role: destructor
    belongs_to: value
    parameters:
      value:
        type: value
        indirection: 1
        description: The value to destroy.
    return_type: ERROR
  # --------------------------------------------------------------------------------------------------------------------
  # Accessors
  # --------------------------------------------------------------------------------------------------------------------
  value_get_bool:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the value as a BOOLEAN.

      A value of a different type is converted through the default cast set, on
      a copy, so reading never alters the value. An unsupported conversion
      returns ERROR_INPUT_INVALID, as does a NULL value.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives the payload as a bool.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_get_utinyint:
