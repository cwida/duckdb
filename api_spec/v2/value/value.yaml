        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_create_interval:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a INTERVAL value.

      The payload is the (months, days, micros) triple, the same unit value_get_interval reports.
      It is not range-checked here; value_cast is the validating path. The
      returned value is caller-owned; destroy it via value_destroy.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      in_value:
        type: interval_t
        indirection: 1
        const: true
        description: The payload to wrap.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new INTERVAL value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_create_decimal:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a DECIMAL value from its backing integer.

      The value is scaled by 10^scale, so (18500, 18, 3) is 18.500. width is
      the total digit count and must be 1..38; scale is the number of digits
      after the point and must not exceed width. Violating either returns
      ERROR_INPUT_INVALID, as does a value too wide for the storage tier the
      width selects. The value itself is not range-checked against the width;
      value_cast is the validating path.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      in_value:
        type: hugeint_t
        indirection: 1
        const: true
        description: The backing integer, scaled by 10^scale.
      width:
        type: u8
        description: Total digit count, 1..38.
      scale:
        type: u8
        description: Digits after the decimal point; must not exceed width.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new DECIMAL value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_create_uuid:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a UUID value from its internal 128-bit form.

      The payload is the storage form a vector element holds, not the canonical
      byte order: the high bit is flipped so the integer sorts. To build one
      from canonical text, cast a VARCHAR with value_cast instead, which is
      also how a UUID renders back.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      in_value:
        type: hugeint_t
        indirection: 1
        const: true
        description: The internal 128-bit storage form.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new UUID value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_create_bit:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a BIT value from its wire bytes.

      The wire form is a mandatory padding-header byte — the count of leading
      bits in the first data byte that are not part of the bit string —
      followed by the data bytes, so the input must be at least 1 byte. These
      are the same bytes value_get_blob reports back.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      in_value:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The wire bytes, a padding header byte followed by data. Must be at least 1 byte.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new BIT value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  value_create_bignum:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a BIGNUM value from its storage bytes.

      The bytes are opaque storage, as produced by bignum_encode from a
      magnitude and a sign flag; a negative is stored bit-inverted behind a
      header, so these are not the magnitude bytes. The header plus at least
      one magnitude byte means the input must exceed 3 bytes. These are the
      same bytes value_get_blob reports back, for bignum_decode to translate.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      in_value:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: The opaque storage bytes from bignum_encode. Must exceed 3 bytes.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new BIGNUM value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  # -----------------------------------------------------------------------
  # Composite constructors
  # -----------------------------------------------------------------------
  value_create_list:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a LIST value from its elements.

      The child type is the common type of the elements, resolved by the same
      rule a SQL list literal follows, and every element is cast to it; a set
      with no common type surfaces the cast error. Pass child_type to name the
      type instead, which is also how an empty list is built: with child_type
      NULL, an empty element array has no type to resolve and returns
      ERROR_INPUT_INVALID.

      The elements are borrowed and copied in, and a NULL element becomes a
      typed NULL. The type is rebuilt from its child, so an alias on the outer
      LIST type is not preserved; value_cast is the alias-preserving path.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      child_type:
        type: logical_type
        description: Optional. The element type. Pass NULL to resolve it from the elements.
      children:
        type: value
        indirection: 1
        const: true
        description: An array of child_count elements. Borrowed (copied in). Pass NULL when child_count is 0.
      child_count:
        type: idx
        description: The number of elements.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_array:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates an ARRAY value from its elements, sized by their count.

      The child type is resolved exactly as for value_create_list, and
      child_type names it explicitly the same way. The minimum array size is 1,
      so an empty element array returns ERROR_INPUT_INVALID whether or not
      child_type is given.

      The elements are borrowed and copied in, and a NULL element becomes a
      typed NULL.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      child_type:
        type: logical_type
        description: Optional. The element type. Pass NULL to resolve it from the elements.
      children:
        type: value
        indirection: 1
        const: true
        description: An array of child_count elements. Borrowed (copied in). Pass NULL when child_count is 0.
      child_count:
        type: idx
        description: The number of elements.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_struct:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a STRUCT value from named fields, in order.

      Each field keeps its own child's type, so there is nothing to resolve
      across them; names and children are parallel arrays of field_count
      entries. An empty field list builds the empty struct, which is a real
      type.

      The names and children are borrowed and copied in, and a NULL child
      becomes a typed NULL. Duplicate field names are rejected.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      names:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: An array of field_count field names. Pass NULL when field_count is 0.
      children:
        type: value
        indirection: 1
        const: true
        description: An array of field_count field values. Borrowed (copied in). Pass NULL when field_count is 0.
      field_count:
        type: idx
        description: The number of fields.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_tuple:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a TUPLE value from positional fields.

      TUPLE is the unnamed struct: the same positional children as
      value_create_struct, under a distinct type id and with no names. Each
      field keeps its own child's type. An empty field list builds the empty
      tuple, which is a real type.

      The children are borrowed and copied in, and a NULL child becomes a typed
      NULL.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      children:
        type: value
        indirection: 1
        const: true
        description: An array of field_count field values. Borrowed (copied in). Pass NULL when field_count is 0.
      field_count:
        type: idx
        description: The number of fields.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_create_map:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a MAP value from parallel key and value arrays.

      The key and value types are the common types of the keys and of the
      values, resolved as for value_create_list, and every entry is cast to
      them. Pass key_type and value_type to name them instead, which is also
      how an empty map is built: with both NULL, empty key and value arrays
      have no types to resolve and return ERROR_INPUT_INVALID.

      Keys and values are borrowed and copied in, and the two arrays must be
      the same length. Keys must be non-NULL and unique; both are enforced.
    role: constructor
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory to create with.
      key_type:
        type: logical_type
        description: Optional. The key type. Pass NULL to resolve it from the keys.
      value_type:
        type: logical_type
        description: Optional. The value type. Pass NULL to resolve it from the values.
      keys:
        type: value
        indirection: 1
        const: true
        description: An array of entry_count keys. Borrowed (copied in). Pass NULL when entry_count is 0.
      values:
        type: value
        indirection: 1
        const: true
        description: An array of entry_count values, parallel to keys. Borrowed (copied in). Pass NULL when entry_count is 0.
      entry_count:
        type: idx
        description: The number of entries.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the new composite value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_get_child_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of child values of a value.

      Per type kind: the element count for LIST and ARRAY; the field count for
      STRUCT and TUPLE; twice the entry count for MAP, whose children alternate
      key, value; and 2 for UNION, the tag plus the active member. Everything
      else reports 0, NULL values of any nested type included.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of children.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_get_child:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns one child of a composite value as an owned copy.

      LIST and ARRAY children are the elements. STRUCT and TUPLE children are
      the fields in declared order, and a STRUCT's field names come from its
      type, via logical_type_get_param. MAP children alternate key, value,
      symmetric with value_create_map. UNION children are [0] the tag, as a
      UTINYINT value, and [1] the active member, because a union value holds
      only that one member.

      Note the divergence from vector_get_child, which descends structurally
      and so exposes [0] = tag and [1..N] = ALL members. Code written to
      descend generically over both must account for that difference.

      An out-of-range index returns ERROR_INPUT_INVALID, as does any index on a
      non-composite or NULL value. The returned value is caller-owned; destroy
      it via value_destroy.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      index:
        type: idx
        description: The child index, in [0, child_count).
      out_child:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned child value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_cast:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Casts a value to a target type, using a factory.

      The conversion is the SQL-faithful, non-strict one, registered custom
      casts included, and a cast failure surfaces from the call. Together with
      a VARCHAR built through value_create_varchar, this constructs any value from text, extension values
      included; casting a member value to a union type, or a VARCHAR to an enum
      type, is the sanctioned way to build UNION and ENUM values.

      A connection's or callback's factory casts with that client's cast
      functions and settings (e.g. TimeZone). An instance's factory supports
      only the built-in casts, with default settings.

      The input value and target type are borrowed. The returned value is
      caller-owned; destroy it via value_destroy.
    role: method
    belongs_to: value
    parameters:
      factory:
        type: factory
        description: The factory supplying the cast functions.
      value:
        type: value
        description: The borrowed value to cast.
      target_type:
        type: logical_type
        description: The borrowed target logical type.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned cast result.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # Common introspection
  # -----------------------------------------------------------------------
  value_is_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: Returns whether the value is NULL.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out_is_null:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives true if the value is NULL, false otherwise.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_get_logical_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the logical type of the value.

      The returned logical type is caller-owned; destroy it via
      logical_type_destroy.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the owned logical type.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  value_to_string:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Renders the value as a human-readable string. Diagnostic only.

      Writes into a caller-supplied buffer, so nothing is allocated on the
      caller's behalf and nothing has to be freed.

      Pass out_string = NULL to size the buffer without rendering into it:
      out_length then receives the length, and out_capacity is ignored. With
      out_string != NULL, out_capacity must be at least out_length + 1, or the
      call returns ERROR_INPUT_OBJECT_SIZE with out_length set to the required
      length and out_string left untouched.

      out_length never counts the terminator, but a successful write always
      appends one, so the buffer is usable as a C string.
    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out_string:
        type: char
        indirection: 1
        kind: OUT
        description: Caller-owned buffer receiving the text plus a null terminator, or NULL to only report the required length in out_length.
      out_capacity:
        type: idx
        description: Bytes available in out_string, terminator included. Ignored when out_string is NULL.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the text length excluding the null terminator — written on success and on ERROR_INPUT_OBJECT_SIZE.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
