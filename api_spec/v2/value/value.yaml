    role: getter
    belongs_to: value
    parameters:
      value:
        type: value
        description: The value to read.
      out:
        type: str
        indirection: 1
        kind: OUT
        description: Receives the payload as a UTF-8 string. The returned string is borrowed and valid until the value handle is destroyed.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

