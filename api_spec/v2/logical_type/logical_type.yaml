module: logical_type
#
# Introspection, plus three construction paths: from a type id
# (create_type_from_id), from SQL text (create_type_from_text), and from a
# generic (name, params) pair (create_type_from_name). All three cover
# built-in and catalog-registered types alike. Every constructor takes a
# factory, and resolves in its scope: catalog types need a connection's or a
# callback's factory, while an instance's factory knows only the built-in types.
# logical_type_to_text renders a type back to SQL text.
#
# Inspection is generic. logical_type_get_param_count and
# logical_type_get_param are the exact dual of the (name, params) and
# (id, params) constructors, and there are no per-kind getters. The DECIMAL
# and ENUM physical storage tiers follow from the width and the dictionary
# size respectively; both mappings are committed contract text on
# vector_get_view rather than getters.
#
# Borrowed views returned by *_get_name, and the name returned by
# *_get_param, are valid until the owning logical_type handle is destroyed.
# The values returned by *_get_param are owned by the caller.
#
# The LOGICAL_TYPE_ID values are the same integers DuckDB uses internally, so
# the numeric round-trip is lossless.

enums:
  LOGICAL_TYPE_ID:
    description: |
      Logical type identifier. The values are the same integers DuckDB uses
      internally, so round-tripping is lossless. The bind- and UDF-only ids
      (UNKNOWN, ANY, TEMPLATE) appear here for completeness; they do not show
      up in result column types in practice.
    values:
      LOGICAL_TYPE_ID_INVALID:
        value: 0
        description: Invalid / unset.
      LOGICAL_TYPE_ID_SQLNULL:
        value: 1
        description: NULL constant type.
      LOGICAL_TYPE_ID_UNKNOWN:
        value: 2
        description: Unknown — used for unresolved parameter expressions.
      LOGICAL_TYPE_ID_ANY:
        value: 3
        description: ANY — used for functions that accept any type.
      LOGICAL_TYPE_ID_TYPE:
        value: 6
        description: A type carried as a value (type parameters). Values of this type are built via value_create_type.
      LOGICAL_TYPE_ID_BOOLEAN:
        value: 10
      LOGICAL_TYPE_ID_TINYINT:
        value: 11
      LOGICAL_TYPE_ID_SMALLINT:
        value: 12
      LOGICAL_TYPE_ID_INTEGER:
        value: 13
      LOGICAL_TYPE_ID_BIGINT:
        value: 14
      LOGICAL_TYPE_ID_DATE:
        value: 15
        description: 32-bit days since epoch.
      LOGICAL_TYPE_ID_TIME:
        value: 16
        description: 64-bit microseconds since midnight.
      LOGICAL_TYPE_ID_TIMESTAMP_SEC:
        value: 17
        description: 64-bit seconds since epoch.
      LOGICAL_TYPE_ID_TIMESTAMP_MS:
        value: 18
        description: 64-bit milliseconds since epoch.
      LOGICAL_TYPE_ID_TIMESTAMP:
        value: 19
        description: 64-bit microseconds since epoch.
      LOGICAL_TYPE_ID_TIMESTAMP_NS:
        value: 20
        description: 64-bit nanoseconds since epoch.
      LOGICAL_TYPE_ID_DECIMAL:
        value: 21
        description: Decimal with width and scale parameters.
      LOGICAL_TYPE_ID_FLOAT:
        value: 22
      LOGICAL_TYPE_ID_DOUBLE:
        value: 23
      LOGICAL_TYPE_ID_VARCHAR:
        value: 25
      LOGICAL_TYPE_ID_BLOB:
        value: 26
      LOGICAL_TYPE_ID_INTERVAL:
        value: 27
      LOGICAL_TYPE_ID_UTINYINT:
        value: 28
      LOGICAL_TYPE_ID_USMALLINT:
        value: 29
      LOGICAL_TYPE_ID_UINTEGER:
        value: 30
      LOGICAL_TYPE_ID_UBIGINT:
        value: 31
      LOGICAL_TYPE_ID_TIMESTAMP_TZ:
        value: 32
        description: 64-bit microseconds since epoch, timezone-aware.
      LOGICAL_TYPE_ID_TIMESTAMP_TZ_NS:
        value: 33
        description: 64-bit nanoseconds since epoch, timezone-aware.
      LOGICAL_TYPE_ID_TIME_TZ:
        value: 34
        description: 64-bit microseconds since midnight + 32-bit offset.
      LOGICAL_TYPE_ID_TIME_NS:
        value: 35
        description: 64-bit nanoseconds since midnight.
      LOGICAL_TYPE_ID_BIT:
        value: 36
      LOGICAL_TYPE_ID_BIGNUM:
        value: 39
        description: Arbitrary-precision integer (VARINT-encoded).
      LOGICAL_TYPE_ID_UHUGEINT:
        value: 49
      LOGICAL_TYPE_ID_HUGEINT:
        value: 50
      LOGICAL_TYPE_ID_UUID:
        value: 54
      LOGICAL_TYPE_ID_GEOMETRY:
        value: 60
        description: Geometry (spatial extension).
      LOGICAL_TYPE_ID_STRUCT:
        value: 100
      LOGICAL_TYPE_ID_LIST:
        value: 101
      LOGICAL_TYPE_ID_MAP:
        value: 102
      LOGICAL_TYPE_ID_ENUM:
        value: 104
      LOGICAL_TYPE_ID_UNION:
        value: 107
      LOGICAL_TYPE_ID_ARRAY:
        value: 108
      LOGICAL_TYPE_ID_VARIANT:
        value: 109
      LOGICAL_TYPE_ID_TUPLE:
        value: 110
        description: Unnamed struct; shares the physical representation of STRUCT.
functions:
  # -----------------------------------------------------------------------
  # Lifecycle
  # -----------------------------------------------------------------------
  factory_create_type_from_id:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a logical type from a type id plus value parameters.

      The id-keyed twin of factory_create_type_from_name: the type id names the
      kind, and the parameters bind it. With param_count 0 it instantiates a
      primitive directly, without touching the catalog: BOOLEAN,
      TINYINT..BIGINT, UTINYINT..UBIGINT, HUGEINT, UHUGEINT, FLOAT, DOUBLE,
      DATE, every TIME and TIMESTAMP variant, INTERVAL, VARCHAR, BLOB, BIT,
      BIGNUM, and UUID. ANY is accepted as well.

      ANY is a function-signature wildcard, constructible here so it can be
      passed to the function parameter and varargs setters, as a fixed-arity
      ANY parameter or an ANY varargs type. Data-creating surfaces reject it:
      value and data chunk creation, scalar and aggregate return types, table
      function result columns, cast source and target types, and custom type
      registration.

      With parameters, the id resolves to its canonical built-in type and binds
      through the same constructors as factory_create_type_from_name, so the parameterized
      kinds construct here too: decimal(width, scale); list(T); array(T, size);
      map(K, V); struct(fields); union(members); enum(entries); and varchar
      with a named "collation" parameter. Parameters are (name, value) pairs in
      two parallel arrays, exactly as for factory_create_type_from_name.

      Returns ERROR_INPUT_INVALID when param_count is 0 and the id needs
      parameters (DECIMAL, LIST, STRUCT, TUPLE, MAP, ARRAY, UNION, ENUM,
      VARIANT, GEOMETRY), for the bind-time-only ids (SQLNULL, UNKNOWN), for
      TYPE — construct that via factory_create_type_from_text — and for INVALID.
    role: constructor
    belongs_to: factory
    parameters:
      factory:
        type: factory
        description: The factory to resolve the type in.
      type_id:
        type: LOGICAL_TYPE_ID
        description: The type id to instantiate.
      param_names:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: Optional. An array of param_count parameter names; a {NULL, 0} entry is positional. Pass NULL for all-positional parameters.
      param_values:
        type: value
        indirection: 1
        const: true
        description: An array of param_count parameter values. Borrowed (copied in). Pass NULL when param_count is 0.
      param_count:
        type: idx
        description: The number of parameters. 0 instantiates a parameterless primitive.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the new logical type handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  factory_create_type_from_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a logical type from a type name plus value parameters.

      The generic constructor: resolves the name in the factory's catalog and
      binds it with the given parameters, exactly as SQL binds a type
      expression. Built-in parameterized kinds and registered extension types
      construct through this same call.

      An unqualified name is resolved along the search path first and then in
      the system catalog, which is where the built-in kinds live. A qualified
      name is resolved exactly as written, with no system-catalog fallback, so
      it names the type in that catalog or schema or fails.

      Parameters are (name, value) pairs in two parallel arrays. param_names
      may be NULL to make every parameter positional, and a {NULL, 0} entry
      makes that one parameter positional. Child types cross as TYPE values,
      built with value_create_type. The
      built-in shapes are: decimal(width, scale); list(T); array(T, size);
      map(K, V); struct(fields, as named or all-positional TYPE values);
      union(members, as named TYPE values); enum(entries, as VARCHAR values);
      and varchar with a named "collation" VARCHAR parameter.

      A name that resolves to a type with no bind function takes no parameters,
      and passing any fails. Bind errors — unknown name, wrong parameter count
      or types — surface from the call.

      Resolves in the scope of the factory: a connection's or callback's
      factory reaches the catalog, an instance's factory knows only the
      built-in types. A connection's factory looks up catalog types in the
      connection's transaction, or in one of its own when none is open. Through an
      instance's factory, only an unqualified built-in name resolves.

      The returned logical type is caller-owned and must be destroyed via
      logical_type_destroy. A type resolved from the catalog shares
      database-owned storage, such as an ENUM dictionary, so destroy it before
      closing the database. This is the inverse of
      logical_type_get_param_count / logical_type_get_param.
    role: constructor
    belongs_to: factory
    parameters:
      factory:
        type: factory
        description: The factory to resolve the type in.
      name:
        type: qname
        description: The type name to resolve. Parts are matched case-insensitively; qualify it to name a type in a particular catalog or schema.
      param_names:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: Optional. An array of param_count parameter names; a {NULL, 0} entry is positional. Pass NULL for all-positional parameters.
      param_values:
        type: value
        indirection: 1
        const: true
        description: An array of param_count parameter values. Borrowed (copied in). Pass NULL when param_count is 0.
      param_count:
        type: idx
        description: The number of parameters.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the new logical type handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  factory_create_type_from_text:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a logical type by parsing SQL text.

      Parses a SQL type expression and returns the bound
      logical type. It accepts primitives ("INTEGER"), parameterized kinds
      ("DECIMAL(18,3)", "INTEGER[]", "STRUCT(a INTEGER, b VARCHAR)",
      "MAP(VARCHAR, INTEGER)", "INTEGER[3]", "UNION(i INTEGER, s VARCHAR)",
      "ENUM('a', 'b')"), and catalog-registered type names, both user-defined
      and from extensions. A catalog type name binds to its structural type,
      and the name is not preserved as an alias. Names are case-insensitive.
      Parse and bind errors surface from the call.

      Resolves in the scope of the factory: a connection's or callback's
      factory reaches the catalog, an instance's factory knows only the
      built-in types. A connection's factory looks up catalog types in the
      connection's transaction, or in one of its own when none is open. Text naming
      only built-in types never touches the catalog.

      The returned logical type is caller-owned and must be destroyed via
      logical_type_destroy. A type resolved from the catalog shares
      database-owned storage, such as an ENUM dictionary, so destroy it before
      closing the database. This is the inverse of logical_type_to_text for
      every constructible kind.
    role: constructor
    belongs_to: factory
    parameters:
      factory:
        type: factory
        description: The factory to resolve the type in.
      text:
        type: str
        indirection: 1
        const: true
        kind: IN
        description: View of the SQL type expression to parse.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the new logical type handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  logical_type_copy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a copy of a logical type.

      On success, writes the new caller-owned handle into *out_type; destroy it
      via logical_type_destroy.
    role: constructor
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        description: The logical type to copy.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the new logical type handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  logical_type_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Destroys a logical type handle.

      Null-safe: passing nullptr or a slot already set to nullptr is a
      no-op. On success the slot is set to nullptr.
    role: destructor
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        indirection: 1
        description: The logical type to destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # Common introspection
  # -----------------------------------------------------------------------
  logical_type_is_equal:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Compares two logical types for deep equality.

      Two types are equal when they agree in kind and in every parameter,
      recursively. DECIMAL(10, 2) equals DECIMAL(10, 2), but not DECIMAL(10, 3)
      and not FLOAT; two STRUCTs are equal when they have the same field names
      in the same order and equal field types.
    belongs_to: logical_type
    parameters:
      left:
        type: logical_type
        description: The first logical type.
      right:
        type: logical_type
        description: The second logical type.
      result:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives the result of the comparison.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  logical_type_get_id:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: Returns the logical type id.
    role: getter
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        description: The logical type.
      out_id:
        type: LOGICAL_TYPE_ID
        indirection: 1
        kind: OUT
        description: Receives the type id.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  logical_type_get_name:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Borrows the logical type's name.

      The alias when one is set — an extension or user-defined name such as
      "POINT_2D" — otherwise the canonical name of the type id, such as
      "INTEGER", "DECIMAL", or "TIMESTAMP WITH TIME ZONE". Never the empty
      view. This is exactly the name vocabulary create_type_from_name accepts.
      The view is valid until the logical type is destroyed; a canonical name
      points at static storage.
    role: getter
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        description: The logical type.
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the name (alias when set, else the id's canonical name).
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  logical_type_to_text:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Renders a logical type as SQL text.

      An aliased type renders as its alias, and create_type_from_text resolves
      that spelling only when the name is registered in the factory's
      catalog. The text round-trips through create_type_from_text for every
      constructible kind, with one exception: ANY renders as "ANY", but
      create_type_from_text cannot parse it back, since ANY is a signature
      wildcard rather than a parseable SQL type.

      Writes into a caller-supplied buffer, so nothing is allocated on the
      caller's behalf and nothing has to be freed. Pass out_text = NULL to size
      the buffer without rendering into it: out_length then receives the
      length, and out_capacity is ignored. With out_text != NULL, out_capacity
      must be at least out_length + 1, or the call returns
      ERROR_INPUT_OBJECT_SIZE with out_length set to the required length and
      out_text left untouched.

      out_length never counts the terminator, but a successful write always
      appends one, so the buffer is usable as a C string.
    role: getter
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        description: The logical type.
      out_text:
        type: char
        indirection: 1
        kind: OUT
        description: Caller-owned buffer receiving the text plus a null terminator, or NULL to only report the required length in out_length.
      out_capacity:
        type: idx
        description: Bytes available in out_text, terminator included. Ignored when out_text is NULL.
      out_length:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the text length excluding the null terminator — written on success and on ERROR_INPUT_OBJECT_SIZE.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
  # -----------------------------------------------------------------------
  # Generic parameter inspection
  # -----------------------------------------------------------------------
  logical_type_get_param_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns the number of value parameters of a logical type.

      The inspection dual of create_type_from_name: these are the parameters
      that reconstruct the type through it. Per kind: DECIMAL 2 (width, scale);
      LIST 1 (element type); ARRAY 2 (element type, size); MAP 2 (key type,
      value type); STRUCT and TUPLE one per field; UNION one per member; ENUM
      one per dictionary entry; VARCHAR 1 when a collation is set, else 0;
      GEOMETRY 1 when a coordinate system is set, else 0; everything else 0. A
      bound type reports only what it actually carries, so a bind-time modifier
      that is not retained — an ignored VARCHAR length, say — does not
      reappear.
    role: getter
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        description: The logical type.
      out_count:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the number of parameters.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  logical_type_get_param:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Returns one value parameter of a logical type.

      out_name receives a borrowed view of the parameter name — a STRUCT field
      name, a UNION member name, "collation" — or the empty view {NULL, 0} for
      a positional parameter. A non-empty view is valid until the logical type
      is destroyed. out_value receives an owned value, destroyed via
      value_destroy: child types come back as TYPE values (unwrap them with
      value_get_type), DECIMAL width and scale as UTINYINT, ARRAY size as
      BIGINT, and ENUM dictionary entries and collations as VARCHAR. An
      out-of-range index returns ERROR_INPUT_INVALID. Each call allocates one
      owned value.
    role: getter
    belongs_to: logical_type
    parameters:
      type:
        type: logical_type
        description: The logical type.
      index:
        type: idx
        description: The parameter index, in [0, param_count).
      out_name:
        type: identifier
        indirection: 1
        kind: OUT_BORROW
        description: Receives a borrowed view of the parameter name, or the empty view {NULL, 0} for a positional parameter.
      out_value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned parameter value.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR

  # TODO: This function should be moved/removed/changed
  factory_create_type_with_alias:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-08-04" ]
    description: |
      Creates a logical type that is an alias of another logical type.

      The alias keeps the base type's internal representation, so executing
      against it needs no special handling, while remaining logically distinct
      from the base type. Intended for custom type bind callbacks, where both
      the base type and the name come from the bind info.

      The alias is not registered anywhere, so this works through any
      factory. An empty alias name returns
      ERROR_INPUT_INVALID.
    role: constructor
    belongs_to: logical_type
    parameters:
      factory:
        type: factory
        description: The factory to resolve the type in.
      base_type:
        type: logical_type
        description: "The logical type to alias. Typically the base type supplied in the custom type bind info."
      alias_name:
        type: identifier
        indirection: 1
        const: true
        kind: IN
        description: "The name for the resulting type. Typically the name of the custom type being constructed, also available from the bind info."
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: "Receives the new type: the base type's internal representation under the given alias name."
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: "Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy."
    return_type: ERROR
  factory_create_common_type:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-09" ]
    description: |
      Creates the common type of a set of logical types.

      The common type is the type every input implicitly casts to, resolved by
      the same rule a SQL list literal and value_create_list follow:
      INTEGER and BIGINT resolve to BIGINT, and DECIMAL(4,1) and DECIMAL(5,4)
      to DECIMAL(7,4). The types are combined pairwise from left to right, and
      the result is not guaranteed to be independent of their order.

      A connection's or a callback's factory also applies the casts that
      extensions registered, while an instance's factory knows only the
      built-in ones, so the two can resolve the same set differently. A single
      type resolves to a copy of itself.

      Returns ERROR_INPUT_INVALID for an empty set, for a NULL entry and for
      ANY, and ERROR_QUERY_NOT_IMPLEMENTED when the types have no common type.
    role: constructor
    belongs_to: factory
    parameters:
      factory:
        type: factory
        description: The factory to resolve the type in.
      types:
        type: logical_type
        indirection: 1
        const: true
        description: An array of type_count logical types. Borrowed.
      type_count:
        type: idx
        description: The number of types. Must be at least 1.
      out_type:
        type: logical_type
        indirection: 1
        kind: OUT
        description: Receives the new logical type handle.
      err:
        type: error_info
        indirection: 1
        kind: OUT
        description: Optional. On failure, receives an opaque info handle the caller must destroy via error_info_destroy.
    return_type: ERROR
