# expression_depth_nesting_rules / expression_depth_chain_rules: see ParsedGrammar::SetExpressionDepth. While an
# expression is transformed, every nesting rule on the transform stack counts one level and every chain rule
# as many levels as it has repeated elements, so that max_expression_depth bounds the depth of the resulting
# expression trees. Add a rule here when its repetitions nest the result one level each.
expression_depth_nesting_rules:
  - SingleExpression
  - Type
  - NestedType
  - SubqueryReference
  - CustomPrefixExpression

expression_depth_chain_rules:
  - LambdaArrowExpression
  - NotExpression
  - IsExpressionContinuation
  - IsDistinctFromExpression
  - ComparisonExpression
  - BetweenInLikeExpression
  - InfixOtherOperatorExpression
  - BitwiseExpression
  - TildeExpression
  - AdditiveExpression
  - MultiplicativeExpression
  - ExponentiationExpression
  - CollateExpression
  - AtTimeZoneExpression
  - PrefixExpression
  - IndirectionList

# collapsible_rules: see ParsedGrammar::SetTransformProcess. Every rule below has a transformer that returns its
# operand unchanged when the rest of the rule matched nothing. Take a rule out of this list if that stops being
# true. The flag is attached to the default transform, so an extension that replaces the transform of
# one of these rules does not inherit it.
collapsible_rules:
  - Expression
  - ColumnDefaultExpr
  - LambdaArrowExpression
  - LogicalOrExpression
  - ColDefOrExpr
  - LogicalAndExpression
  - ColDefAndExpr
  - LogicalNotExpression
  - IsExpression
  - IsDistinctFromExpression
  - ComparisonExpression
  - BetweenInLikeExpression
  - OtherOperatorExpression
  - InfixOtherOperatorExpression
  - BitwiseExpression
  - TildeExpression
  - AdditiveExpression
  - MultiplicativeExpression
  - ExponentiationExpression
  - CollateExpression
  - AtTimeZoneExpression
  - PrefixExpression
  - BaseExpression
  - SelectSetOpChain
  - IntersectChain
  - TableRef

packrat_memoized_rules:
  - Expression
  - TableRef
  - Identifier
  - ColId
  - CatalogQualification
  - SchemaQualification
  - ReservedSchemaQualification

# rule_labels: see Matcher::SetLabel. When a syntax error lists what the parser expected at the failure point,
# every alternative inside a labelled rule is summarised by the label instead of being spelled out. Only label
# rules that cannot match empty input and that accept a plain identifier somewhere.
rule_labels:
  an expression:
    - Expression
    - LambdaArrowExpression
    - LogicalOrExpression
    - LogicalAndExpression
    - LogicalNotExpression
    - IsExpression
    - IsDistinctFromExpression
    - ComparisonExpression
    - BetweenInLikeExpression
    - OtherOperatorExpression
    - InContainsExpression
    - BitwiseExpression
    - AdditiveExpression
    - MultiplicativeExpression
    - ExponentiationExpression
    - CollateExpression
    - AtTimeZoneExpression
    - PrefixExpression
    - BaseExpression
    - SingleExpression
  a type:
    - Type

