name: Regression
on:
  workflow_call:
    inputs:
      duckdb_commit:
        type: string
      duckdb_version:
        type: string
      base_hash:
        type: string
      build_current_release:
        default: false
        type: boolean
      images:
        required: true
        type: string
      run_slow_tests:
        default: false
        type: boolean
      runners:
        required: true
        type: string
      runner_provider:
        required: true
        type: string
      save_cache:
        default: false
        type: boolean
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit != '' && inputs.duckdb_commit || github.sha }}
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  GIT_REF: ${{ inputs.duckdb_commit != '' && inputs.duckdb_commit || github.sha }}
  BASE_BRANCH: ${{ github.base_ref || (endsWith(github.ref_name, '_feature') && 'feature' || 'main') }}
  BASE_HASH: ${{ inputs.base_hash }}

jobs:
  linux-base:
    name: Linux Base
    runs-on: ${{ fromJSON(inputs.runners).linux_x64 }}
    container:
      image: ${{ fromJson(inputs.images).manylinux_amd64_main }}
    env:
      GEN: ninja

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ inputs.runner_provider }}
          fetch_depth: 0
          ref: ${{ env.GIT_REF }}

      - uses: ./.github/actions/ccache-action

      - name: Build current release
        if: ${{ inputs.build_current_release }}
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          EXTENSION_CONFIGS: '${{ github.workspace }}/.github/config/linux_release_extensions.cmake'
          DUCKDB_CAPABILITIES: 'httplib loadable_extensions'
          BUILD_BENCHMARK: 1
          BUILD_JEMALLOC: 1
          FORCE_WARN_UNUSED: 1
          DISABLE_SANITIZER: 1
        with:
          build: python3 scripts/ci/retry.py -- make release
          bundle: make release-artifact RELEASE_ARTIFACT_TARBALL=build/linux-release-build.tar.gz
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
          save-cache: ${{ inputs.save_cache }}

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.build_current_release }}
        with:
          path: build/linux-release-build.tar.gz
          if-no-files-found: error
          archive: false

      - name: Select base ref
        run: |
          if [[ "${{ github.repository }}" == "duckdb/duckdb" && "${{ github.ref_name }}" == "main" ]]; then
            if [[ -z "${BASE_HASH}" ]]; then
              BASE_REF="$(bash scripts/ci/last_main_success_commit.sh)"
            else
              BASE_REF="${BASE_HASH}"
            fi
          else
            git fetch https://github.com/duckdb/duckdb.git "${BASE_BRANCH}:refs/remotes/duckdb/${BASE_BRANCH}"
            if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "merge_group" ]]; then
              BASE_REF="$(git merge-base "${GIT_REF}" "duckdb/${BASE_BRANCH}")"
              if [[ -z "${BASE_REF}" ]]; then
                echo "Failed to compute merge base between ${GIT_REF} and duckdb/${BASE_BRANCH}"
                exit 1
              fi
            else
              BASE_REF="duckdb/${BASE_BRANCH}"
            fi
          fi
          echo "Selected base ref: ${BASE_REF}"
          echo "Current ref: ${GIT_REF}"
          echo "Base branch ref: duckdb/${BASE_BRANCH}"
          echo "BASE_REF=${BASE_REF}" >> "$GITHUB_ENV"

      - name: Reset workspace to base ref
        run: |
          make clean
          git checkout --detach "${BASE_REF}"
          git submodule update --init --recursive

      - name: Upload base TPC-DS answers
        uses: actions/upload-artifact@v7
        with:
          name: linux-base-tpcds-answers
          path: extension/tpcds/dsdgen/answers
          if-no-files-found: error

      - name: Build base release
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          BUILD_BENCHMARK: 1
          BUILD_JEMALLOC: 1
          CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
          DISABLE_SANITIZER: 1
        with:
          build: python3 scripts/ci/retry.py -- make release
          bundle: make release-artifact
          upload-name: linux-base-build
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
          save-cache: ${{ inputs.save_cache }}

  regression-bench:
    name: Bench ${{ matrix.name }}
    needs:
      - linux-base
    runs-on: ${{ fromJSON(inputs.runners).linux_small }}
    container:
      image: ${{ fromJson(inputs.images).manylinux_amd64_main }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ingestion Perf
            benchmark: .github/regression/ingestion.csv
          - name: Micro
            benchmark: .github/regression/micro.csv
          - name: Parser
            benchmark: .github/regression/parser.csv
          - name: H2OAI (small)
            benchmark: .github/regression/h2oai_small.csv
          - name: IMDB
            benchmark: .github/regression/imdb.csv
          - name: CSV
            benchmark: .github/regression/csv.csv
          - name: RealNest
            benchmark: .github/regression/realnest.csv
            data_setup: |
              mkdir -p duckdb_benchmark_data
              python3 scripts/ci/retry.py -- wget -q https://blobs.duckdb.org/data/realnest/realnest.duckdb --output-document=duckdb_benchmark_data/real_nest.duckdb
          - name: Recursive CTE
            benchmark: benchmark/recursive_cte/recursive_cte.csv
          - name: AoC24
            benchmark: benchmark/aoc24/aoc24.csv

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GIT_REF }}

      - name: Download current release artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-release-build.tar.gz
          path: build/current

      - name: Extract current release artifact
        run: |
          rm -rf build/current/release
          tar -xzf build/current/linux-release-build.tar.gz -C build/current

      - name: Download base artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-base-build
          path: build/base

      - name: Extract base artifact
        run: |
          rm -rf build/base/release
          tar -xzf build/base/release-artifact.tar.gz -C build/base

      - name: Prepare benchmark data
        if: ${{ matrix.data_setup }}
        run: ${{ matrix.data_setup }}

      - name: Run regression benchmark
        run: |
          python scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/current/release/benchmark/benchmark_runner \
            --benchmarks "${{ matrix.benchmark }}" \
            --verbose \
            --early-stop \
            --memory-limit 6.5GiB \
            --threads 2

  regression-bench-tpc:
    name: Bench ${{ matrix.name }}
    if: ${{ github.repository_owner == 'duckdb' }}
    needs:
      - linux-base
    runs-on: ${{ fromJSON(inputs.runners).linux_small }}
    container:
      image: ${{ fromJson(inputs.images).manylinux_amd64_main }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: TPCH SF10
            benchmarks: .github/regression/tpch_sf10.csv
            threads: 4
            sf: 10
          - name: TPCDS SF10
            benchmarks: .github/regression/tpcds_sf10.csv
            threads: 4
            sf: 10
            extra_args: --old-tpcds-answers build/base/tpcds-answers
          - name: TPCH-PARQUET SF1
            benchmarks: .github/regression/tpch_parquet.csv
            threads: 2
            sf: 1

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ inputs.runner_provider }}
          ref: ${{ env.GIT_REF }}

      - name: Download current release artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-release-build.tar.gz
          path: build/current

      - name: Extract current release artifact
        run: |
          rm -rf build/current/release
          tar -xzf build/current/linux-release-build.tar.gz -C build/current

      - name: Download base artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-base-build
          path: build/base

      - name: Extract base artifact
        run: |
          rm -rf build/base/release
          tar -xzf build/base/release-artifact.tar.gz -C build/base

      - name: Download base TPC-DS answers
        if: ${{ matrix.name == 'TPCDS SF10' }}
        uses: actions/download-artifact@v8
        with:
          name: linux-base-tpcds-answers
          path: build/base/tpcds-answers

      - name: Run regression benchmark
        run: |
          python scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/current/release/benchmark/benchmark_runner \
            --benchmarks ${{ matrix.benchmarks }} \
            ${{ matrix.extra_args }} \
            --verbose \
            --early-stop \
            --disable-timeout \
            --memory-limit 6.5GiB \
            --benchmark-argument sf=${{ matrix.sf }} \
            --threads ${{ matrix.threads }}

  regression-bench-fivetran:
    name: Bench Fivetran
    if: ${{ github.repository == 'duckdb/duckdb' && github.ref_name == 'main' }}
    needs:
      - linux-base
    runs-on: ${{ fromJSON(inputs.runners).linux_small }}
    container:
      image: ${{ fromJson(inputs.images).manylinux_amd64_main }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.GIT_REF }}

      - name: Checkout Private Regression
        if: ${{ github.repository == 'duckdb/duckdb' && github.ref_name == 'main' }}
        uses: actions/checkout@v6
        with:
          repository: duckdblabs/fivetran_regression
          ref: main
          token: ${{ secrets.DUCKDBLABS_BOT_TOKEN }}
          path: benchmark/fivetran

      - name: Download current release artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-release-build.tar.gz
          path: build/current

      - name: Extract current release artifact
        run: |
          rm -rf build/current/release
          tar -xzf build/current/linux-release-build.tar.gz -C build/current

      - name: Download base artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-base-build
          path: build/base

      - name: Extract base artifact
        run: |
          rm -rf build/base/release
          tar -xzf build/base/release-artifact.tar.gz -C build/base

      - name: Run regression benchmark
        run: |
          python scripts/regression/test_runner.py \
            --old build/base/release/benchmark/benchmark_runner \
            --new build/current/release/benchmark/benchmark_runner \
            --benchmarks benchmark/fivetran/benchmark_list.csv \
            --verbose \
            --early-stop \
            --memory-limit 6.5GiB \
            --threads 2

  regression-tests:
    name: Regression Tests
    needs:
      - linux-base
    runs-on: ${{ fromJSON(inputs.runners).linux_small }}
    container:
      image: ${{ fromJson(inputs.images).manylinux_amd64_main }}

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ inputs.runner_provider }}
          ref: ${{ env.GIT_REF }}

      - name: Download current release artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-release-build.tar.gz
          path: build/current

      - name: Extract current release artifact
        run: |
          rm -rf build/current/release
          tar -xzf build/current/linux-release-build.tar.gz -C build/current

      - name: Download base artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-base-build
          path: build/base

      - name: Extract base artifact
        run: |
          rm -rf build/base/release
          tar -xzf build/base/release-artifact.tar.gz -C build/base

      - name: Storage Size Regression Test
        run: |
          python scripts/regression_test_storage_size.py --old build/base/release/duckdb --new build/current/release/duckdb

      - name: Binary Size Regression Test
        if: success() || failure()
        env:
          EXTENSION_STATIC_BUILD: 1
        run: |
          python scripts/regression_test_extension_size.py --old build/base/release --new build/current/release --expect cli,json,parquet,tpch,tpcds

      - name: IMDB Plan Cost Regression Test
        if: success() || failure()
        run: |
          python scripts/plan_cost_runner.py --old build/base/release/duckdb --new build/current/release/duckdb --dir=benchmark/imdb_plan_cost --extension=httpfs

      - name: TPCH Plan Cost Regression Test
        if: success() || failure()
        run: |
          python scripts/plan_cost_runner.py --old build/base/release/duckdb --new build/current/release/duckdb --dir=benchmark/tpch_plan_cost --extension=tpch
