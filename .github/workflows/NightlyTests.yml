name: NightlyTests
on:
  workflow_dispatch:
  repository_dispatch:
  push:
    branches-ignore:
      - 'main'
      - 'feature'
      - 'v*.*-*'
      - 'gh-readonly-queue/**'
    paths:
      - '.github/workflows/NightlyTests.yml'
      - '.github/patches/duckdb-wasm/**'
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft]
    paths:
      - '.github/workflows/NightlyTests.yml'
      - '.github/patches/duckdb-wasm/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_WASM_VERSION: "cf2048bd6d669ffa05c56d7d453e09e99de8b87e"
  REDUCE_SYMBOLS: 1
  PYTHONUNBUFFERED: 1

jobs:
  check-draft:
    # We run all other jobs on PRs only if they are not draft PR
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - name: Preliminary checks on CI
        run: echo "Event name is ${{ github.event_name }}"

  clang-tidy:
    name: Clang-Tidy (${{ matrix.shard }}/4)
    needs: check-draft
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CC: gcc
      CXX: g++
      GEN: ninja

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        timeout-minutes: 10
        run: |
          python3 scripts/ci/retry.py -- make toolsci
          python3 scripts/ci/retry.py -- sudo apt-get update -y -qq
          python3 scripts/ci/retry.py -- sudo apt-get install -y -qq clang-tidy-20

      - name: Clang-Tidy
        shell: bash
        run: |
          log_file=clang-tidy-shard-${{ matrix.shard }}.log
          if make tidy-check \
              TIDY_BINARY=clang-tidy-20 \
              TIDY_SHARD_COUNT=4 \
              TIDY_SHARD_INDEX=$((${{ matrix.shard }} - 1)) \
              >"${log_file}" 2>&1; then
            tidy_status=0
          else
            tidy_status=$?
          fi
          python3 scripts/ci/summarize_clang_tidy.py "${log_file}" --command-exit-code "${tidy_status}"
          exit "${tidy_status}"

      - name: Upload clang-tidy log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: clang-tidy-log-${{ matrix.shard }}
          path: clang-tidy-shard-${{ matrix.shard }}.log
          if-no-files-found: error

  codeql-analyze:
    name: Analyze (${{ matrix.language }})
    needs: check-draft
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
          - c-cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup proxy for registries
        run: echo "No registry proxy configuration required"

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  linux-memory-leaks:
     name: Linux Memory Leaks
     needs: check-draft
     runs-on: ubuntu-24.04
     env:
       GEN: ninja

     steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - uses: actions/setup-python@v6
       with:
         python-version: '3.12'

     - name: Install Ninja
       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       shell: bash
       run: python3 scripts/ci/retry.py -- make

     - name: Test
       shell: bash
       run: |
         python3 test/memoryleak/test_memory_leaks.py

  release-assert:
    name: Release Assertions
    runs-on: ubuntu-latest
    needs: linux-memory-leaks
    env:
      GEN: ninja
      BUILD_JEMALLOC: 1
      CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;httpfs"
      DISABLE_SANITIZER: 1
      CRASH_ON_ASSERT: 1
      RUN_SLOW_VERIFIERS: 1

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install
      run: python3 scripts/ci/retry.py -- make toolsci

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.5
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

    - name: Build
      shell: bash
      env:
        VCPKG_TOOLCHAIN_PATH: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        USE_MERGED_VCPKG_MANIFEST: 1
      run: python3 scripts/ci/retry.py -- bash -lc 'UNSAFE_NUMERIC_CAST=1 make relassert'

    - name: Test
      shell: bash
      run: |
          ./build/relassert/test/run --test-config test/configs/release_assertions.json --batch-timeout 600 "*"

  release-assert-osx-storage:
    name: Release Assertions OSX Storage
    runs-on: macos-latest
    needs: linux-memory-leaks
    env:
      GEN: ninja
      CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet"
      DISABLE_SANITIZER: 1
      CRASH_ON_ASSERT: 1
      RUN_SLOW_VERIFIERS: 1

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Ninja
      run: python3 scripts/ci/retry.py -- brew install ninja

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Build
      uses: duckdb/duckdb-ci/build-duckdb@main
      with:
        build-type: relassert
        build: python3 scripts/ci/retry.py -- bash -lc 'UNSAFE_NUMERIC_CAST=1 make relassert'
        vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
        cache-suffix: nightly_release_assert_osx_storage

    - name: Test
      shell: bash
      run: |
          ./build/relassert/test/run --test-config test/configs/release_assertions.json --batch-timeout 600 "*"

  smaller-binary:
    name: Smaller Binary
    runs-on: ubuntu-24.04
    needs: linux-memory-leaks
    env:
      GEN: ninja
      BUILD_JEMALLOC: 1
      CORE_EXTENSIONS: "icu;tpch;tpcds;json"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install
      run: python3 scripts/ci/retry.py -- make toolsci

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Build
      shell: bash
      run: python3 scripts/ci/retry.py -- bash -lc 'SMALLER_BINARY=1 make'

    - name: Measure Size
      shell: bash
      run: ls -trlah build/release/src/libduckdb*

    - name: Test
      shell: bash
      run: |
          make allunit

  release-assert-clang:
    name: Release Assertions with Clang
    runs-on: ubuntu-latest
    needs: linux-memory-leaks
    env:
      CC: clang
      CXX: clang++
      GEN: ninja
      BUILD_JEMALLOC: 1
      CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;httpfs"
      DISABLE_SANITIZER: 1
      CRASH_ON_ASSERT: 1
      RUN_SLOW_VERIFIERS: 1

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install
      run: python3 scripts/ci/retry.py -- make toolsci

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11.5
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      with:
        vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24

    - name: Build
      shell: bash
      env:
        VCPKG_TOOLCHAIN_PATH: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
        USE_MERGED_VCPKG_MANIFEST: 1
      run: python3 scripts/ci/retry.py -- bash -lc 'UNSAFE_NUMERIC_CAST=1 make relassert'

    - name: Test
      shell: bash
      run: |
          ./build/relassert/test/run --test-config test/configs/release_assertions.json --batch-timeout 600 "*"

  valgrind:
    name: Valgrind
    runs-on: ubuntu-24.04
    needs: linux-memory-leaks
    env:
      CC: clang-20
      CXX: clang++-20
      DISABLE_SANITIZER: 1
      BUILD_JEMALLOC: 1
      CORE_EXTENSIONS: 'icu;json;parquet;tpch'
      GEN: ninja

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install
      timeout-minutes: 10
      shell: bash
      run: |
        python3 scripts/ci/retry.py -- make toolsci
        python3 scripts/ci/retry.py -- sudo apt-get install -y -qq valgrind clang

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Build
      shell: bash
      run: python3 scripts/ci/retry.py -- make relassert

    - name: Output version info
      shell: bash
      run: ./build/relassert/duckdb -c "PRAGMA version;"

    - name: Test
      shell: bash
      run: ./build/relassert/test/run --retry 0 --workers 1 --batch-size 1 --batch-timeout 1200 --test-command "valgrind {binary} {flags} -f {test_list}" test/sql/tpch/tpch_sf001.test_slow

  sqllogic:
     name: Sqllogic tests
     runs-on: ubuntu-latest # Secondary task of this CI job is to test building duckdb on latest ubuntu
     needs: linux-memory-leaks
     steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Install tools
       shell: bash
       run: python3 scripts/ci/retry.py --timeout 2m -- make toolsci

     # Build is implied by 'make sqlite' that will invoke implicitly 'make release' (we make it explicit)
     - name: Build
       shell: bash
       run: python3 scripts/ci/retry.py -- make release

     - name: Test
       shell: bash
       run: make sqlite

  storage-initialization:
     name: Storage Initialization Verification
     runs-on: ubuntu-24.04
     needs: linux-memory-leaks
     env:
       CC: gcc
       CXX: g++
       GEN: ninja

     steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - name: Install
       shell: bash
       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       shell: bash
       run: make debug

     - name: Test
       shell: bash
       run: python3 scripts/test_zero_initialize.py

  extension-updating:
    name: Extension updating test
    runs-on: ubuntu-24.04
    needs: linux-memory-leaks
    env:
      CC: gcc
      CXX: g++
      GEN: ninja

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout duckdb-httpfs
        uses: actions/checkout@v6
        with:
          repository: duckdb/duckdb-httpfs
          submodules: 'true'
          path: duckdb-httpfs

      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install
        shell: bash
        run: curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://rclone.org/install.sh | sudo bash

      - uses: ./.github/actions/ccache-action

      - uses: ./.github/actions/cleanup_runner

      - uses: ./.github/actions/swap_space

      - name: Build
        shell: bash
        run: python3 scripts/ci/retry.py -- bash -lc 'CORE_EXTENSIONS="tpch" LINK_CORE_EXTENSIONS=1 make'

      - name: Start Minio
        working-directory: ${{ github.workspace }}/duckdb-httpfs
        shell: bash
        run: |
          export PATH="${{ github.workspace }}/build/release:$PATH"
          sudo ./scripts/install_s3_test_server.sh
          ./scripts/generate_presigned_url.sh
          source ./scripts/run_s3_test_server.sh
          source ./scripts/set_s3_test_server_variables.sh
          sleep 60

      - name: Run Extension Medata Tests
        shell: bash
        run: |
          ./scripts/run_extension_medata_tests.sh "${{ github.workspace }}/build/release/src/libduckdb_static.a"

  regression-test-memory-safety:
   name: Regression Tests between safe and unsafe builds
   runs-on: ubuntu-24.04
   needs: linux-memory-leaks
   env:
     CC: gcc
     CXX: g++
     GEN: ninja
     BUILD_BENCHMARK: 1
     BUILD_JEMALLOC: 1
     CORE_EXTENSIONS: "tpch;tpcds;httpfs"

   steps:
     - name: Checkout
       uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - name: Checkout tools repo
       uses: actions/checkout@v6
       with:
         fetch-depth: 0
         path: unsafe

     - uses: actions/setup-python@v6
       with:
         python-version: '3.12'

     - name: Install
       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       uses: duckdb/duckdb-ci/build-duckdb@main
       with:
         build-type: release
         build: |
           python3 scripts/ci/retry.py -- make

           cd unsafe
           python3 ../scripts/ci/retry.py -- bash -lc 'UNSAFE_NUMERIC_CAST=1 DISABLE_MEMORY_SAFETY=1 make'
         vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
         cache-suffix: nightly_regression_test_memory_safety

     - name: Set up benchmarks
       shell: bash
       run: |
         cp -r benchmark unsafe/

     - name: Regression Test Micro
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/micro.csv --verbose --threads 2

     - name: Regression Test TPCH
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/tpch.csv --verbose --threads 2

     - name: Regression Test TPCDS
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/tpcds.csv --verbose --threads 2

     - name: Regression Test H2OAI
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/h2oai.csv --verbose --threads 2

     - name: Regression Test IMDB
       if: always()
       shell: bash
       run: |
         python scripts/regression/test_runner.py --old unsafe/build/release/benchmark/benchmark_runner --new build/release/benchmark/benchmark_runner --benchmarks .github/regression/imdb.csv --verbose --threads 2

  vector-and-block-sizes:
    name: Tests non-default vector and block size
    runs-on: ubuntu-24.04
    env:
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/.sanitizer-leak-suppressions.txt
    needs: linux-memory-leaks

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci

      - uses: ./.github/actions/ccache-action

      - uses: ./.github/actions/cleanup_runner

      - uses: ./.github/actions/swap_space

      - name: Build
        id: build
        shell: bash
        env:
          CORE_EXTENSIONS: "json;parquet"
          GEN: ninja
          STANDARD_VECTOR_SIZE: 512
          DISABLE_SANITIZER: 1
        run: python3 scripts/ci/retry.py -- make relassert

      - name: All tests with 512 vector size and default block size
        shell: bash
        run: ./build/relassert/test/run --test-config=test/configs/vector_size_512.json "*"

      - name: All tests with 512 vector size and 16kB block size
        shell: bash
        run: ./build/relassert/test/run --test-config=test/configs/block_size_16kB.json "*"

      - name: All tests with a smaller initial column segment size
        shell: bash
        run: ./build/relassert/test/run --test-config=test/configs/initial_column_segment_size.json "*"

  force-blocking-sink-source:
    name: Forcing async Sinks/Sources
    runs-on: ubuntu-24.04
    needs: check-draft
    env:
      GEN: ninja
      CORE_EXTENSIONS: "icu;parquet;tpch;tpcds;fts;json;inet"
      FORCE_ASYNC_SINK_SOURCE: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci

      - uses: ./.github/actions/ccache-action

      - uses: ./.github/actions/cleanup_runner

      - uses: ./.github/actions/swap_space

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          DISABLE_SANITIZER: 1
        with:
          build-type: relassert
          build: python3 scripts/ci/retry.py -- make relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
          cache-suffix: nightly_force_blocking_sink_source

      - name: Test
        shell: bash
        run: ./build/relassert/test/run --batch-timeout 600

  linux-wasm-experimental:
    name: WebAssembly duckdb-wasm builds
    # disable in NightlyTests
    if: ${{ vars.ENABLE_WASM_EXPERIMENTAL == 'true' }}
    needs: check-draft
    runs-on: ubuntu-22.04
    steps:
    - uses: emscripten-core/setup-emsdk@v16
      with:
        version: 'latest'

    - name: Setup
      shell: bash
      run: |
        python3 scripts/ci/retry.py -- git clone https://github.com/duckdb/duckdb-wasm
        cd duckdb-wasm
        git checkout "${{ env.DUCKDB_WASM_VERSION }}"
        shopt -s nullglob
        for filename in ../.github/patches/duckdb-wasm/*.patch; do
          git apply "$filename"
        done
        git submodule init
        git submodule update
        git rm -r submodules/duckdb

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        path: duckdb-wasm/submodules/duckdb

    - name: Install tools
      shell: bash
      run: make -C duckdb-wasm/submodules/duckdb toolsci

    - name: Setup
      shell: bash
      run: |
        cd duckdb-wasm
        make patch_duckdb || echo "done"

    - uses: ./.github/actions/ccache-action

    - uses: ./.github/actions/cleanup_runner

    - uses: ./.github/actions/swap_space

    - name: Print version
      shell: bash
      run: |
        emcc --version

    - name: Build WebAssembly MVP
      shell: bash
      run: |
        cd duckdb-wasm
        bash scripts/wasm_build_lib.sh relsize mvp "$PWD/submodules/duckdb"

    - name: Build WebAssembly EH
      shell: bash
      run: |
        cd duckdb-wasm
        bash scripts/wasm_build_lib.sh relsize eh "$PWD/submodules/duckdb"

    - name: Build WebAssembly COI
      shell: bash
      run: |
        cd duckdb-wasm
        bash scripts/wasm_build_lib.sh relsize coi "$PWD/submodules/duckdb"

    - name: Package
      shell: bash
      run: |
        zip -r duckdb-wasm32.zip duckdb-wasm/packages/duckdb-wasm/src/bindings

    - uses: actions/upload-artifact@v7
      with:
        name: duckdb-wasm32
        path: |
          duckdb-wasm32.zip

  hash-zero:
   name: Hash Zero
   runs-on: ubuntu-24.04
   needs: linux-memory-leaks
   env:
     GEN: ninja
     CORE_EXTENSIONS: "icu;parquet;tpch;tpcds;fts;json;inet"
     HASH_ZERO: 1
     DISABLE_SANITIZER: 1
     LSAN_OPTIONS: suppressions=${{ github.workspace }}/.sanitizer-leak-suppressions.txt
     DUCKDB_TEST_DESCRIPTION: 'Compiled with HASH_ZERO=1. Use require no_hash_zero to skip.'

   steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0

     - name: Install
       run: python3 scripts/ci/retry.py -- make toolsci

     - uses: ./.github/actions/ccache-action

     - uses: ./.github/actions/cleanup_runner

     - uses: ./.github/actions/swap_space

     - name: Build
       uses: duckdb/duckdb-ci/build-duckdb@main
       with:
         build-type: relassert
         build: python3 scripts/ci/retry.py -- make relassert
         vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
         cache-suffix: nightly_hash_zero

     - name: Test
       shell: bash
       timeout-minutes: 45
       # HASH_ZERO=1 triggers hash collisions; some test statements can turn
       # quadratic. Isolate each test and report body timeouts without failing;
       # correctness failures and cleanup hangs still fail the job.
       run: make unittest_relassert T="--track-runtime 30 --batch-size 1 --batch-timeout 60 --timeout-policy warn --test-config=test/configs/hash_zero.json"


  bwc-build:
    name: Build DuckDB
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.resolve.outputs.groups }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve versions
        id: resolve
        run: |
          groups_json=$(python3 test/bwc/list_versions.py --groups-json)
          echo "groups=${groups_json}" >> "$GITHUB_OUTPUT"
          echo "Resolved BWC version groups: ${groups_json}"

      - name: Install
        run: python3 scripts/ci/retry.py -- make toolsci

      - name: Setup ccache
        uses: ./.github/actions/ccache-action

      - name: Build DuckDB
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: release
          build: |
            python3 scripts/ci/retry.py -- make release \
              EXTENSION_CONFIGS='.github/config/extensions/httpfs.cmake;.github/config/extensions/test-utils.cmake;.github/config/extensions/inet.cmake' \
              STATICALLY_LINK_EXTENSIONS='core_functions;parquet;json;icu;tpcds;tpch;autocomplete;httpfs;inet;test_utils' \
              DUCKDB_EXTENSIONS='tpcds;icu;autocomplete;tpch;json'
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
          cache-suffix: nightly_bwc_build

      - name: Upload DuckDB binary
        uses: actions/upload-artifact@v7
        with:
          name: duckdb-binary
          path: build/release/duckdb

  bwc-test:
    name: BWC Test (DuckDB ${{ matrix.series.group }})
    runs-on: ubuntu-latest
    needs: bwc-build
    strategy:
      fail-fast: false
      matrix:
        series: ${{ fromJSON(needs.bwc-build.outputs.groups) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Download DuckDB binary
        uses: actions/download-artifact@v8
        with:
          name: duckdb-binary
          path: build/release

      - name: Make DuckDB binary executable
        run: chmod +x build/release/duckdb

      - name: Install Python dependencies
        run: python3 scripts/ci/retry.py -- pip install duckdb git+https://github.com/duckdb/duckdb-sqllogictest-python.git

      - name: Run BWC series
        run: |
          versions='${{ toJson(matrix.series.versions) }}'
          mapfile -t VERSION_LIST < <(python3 -c 'import json,sys; [print(v) for v in json.loads(sys.argv[1])]' "$versions")
          FAILED=0
          FAILED_VERSIONS=""
          RUNTIME_DIR="duckdb_unittest_tempdir/bwc/runtime"
          mkdir -p "${RUNTIME_DIR}"
          mkdir -p duckdb_unittest_tempdir/bwc/cache

          for VERSION in "${VERSION_LIST[@]}"; do
            echo "============================================================"
            echo "Running BWC for ${VERSION} (group: ${{ matrix.series.group }})"
            echo "============================================================"

            if [ "${{ vars.ENABLE_BWC_CACHE_DOWNLOAD }}" = "true" ]; then
              CACHE_ARCHIVE="runtime_${VERSION}.tar.gz"
              DOWNLOAD_URL="https://raw.githubusercontent.com/duckdb/bwc-test-utils/main/cache/${CACHE_ARCHIVE}"
              HTTP_CODE=$(curl -sL -w '%{http_code}' -o "/tmp/${CACHE_ARCHIVE}" "${DOWNLOAD_URL}" || true)
              if [ "${HTTP_CODE}" = "200" ]; then
                tar xzf "/tmp/${CACHE_ARCHIVE}" -C "${RUNTIME_DIR}"
                CACHED=$(find "${RUNTIME_DIR}/${VERSION}" -name "*.plan.bin" | wc -l)
                echo "Extracted cache for ${VERSION}: ${CACHED} cached test plans"
              else
                echo "Failed to download cache for ${VERSION} (HTTP ${HTTP_CODE})"
                FAILED=1
                FAILED_VERSIONS="${FAILED_VERSIONS} ${VERSION}(cache)"
              fi
            fi

            if ! python3.11 test/bwc/runner.py --old_duckdb_version="${VERSION}"; then
              FAILED=1
              FAILED_VERSIONS="${FAILED_VERSIONS} ${VERSION}(tests)"
            fi

            if ! python3.11 test/bwc/export_cache.py --version "${VERSION}" --output-dir duckdb_unittest_tempdir/bwc/cache; then
              FAILED=1
              FAILED_VERSIONS="${FAILED_VERSIONS} ${VERSION}(export)"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "BWC series had failures:${FAILED_VERSIONS}"
            exit 1
          fi

      - name: Upload BWC cache
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bwc-cache-${{ matrix.series.group }}
          path: duckdb_unittest_tempdir/bwc/cache/runtime_*.tar.gz

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bwc-test-results-${{ matrix.series.group }}
          path: |
            duckdb_unittest_tempdir/bwc/tests_summary_*.txt
            duckdb_unittest_tempdir/bwc/reports/test_report_*.duckdb

  summary:
    name: BWC Test Summary
    runs-on: ubuntu-24.04
    needs: bwc-test
    if: always()
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: bwc-test-results-*
          merge-multiple: true

      - name: Aggregate results
        run: |
          echo "============================================================"
          echo "BWC Test Summary"
          echo "============================================================"
          failed=0
          for summary in tests_summary_*.txt; do
            [ -f "$summary" ] || continue
            version="${summary#tests_summary_}"
            version="${version%.txt}"
            failures=$(grep '# FAILED' "$summary" || true)
            if [ -n "$failures" ]; then
              echo ""
              echo "Failed tests for DuckDB version '$version':"
              echo "$failures" | while read -r line; do
                echo "  $line"
              done
              failed=1
            fi
          done
          echo "============================================================"
          if [ "$failed" -eq 1 ]; then
            echo "Some BWC tests failed."
            exit 1
          else
            echo "All BWC tests passed."
          fi

  # checks that cmake-generated project is consistent on re-configure
  cmake-reconfigure-check:
    name: CMake Reconfigure Check
    runs-on: ${{ matrix.os }}
    needs: check-draft
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Check Architecture Flags
        run: |
          cmake -P scripts/ci/test_architecture_flags.cmake

      - name: Create Dir
        run: |
          mkdir build

      - name: Configure
        working-directory: build
        run: |
          cmake .. -G Ninja

      - name: Reconfigure
        working-directory: build
        run: |
          cp build.ninja clean_build.ninja
          cmake .. -G Ninja

      - name: Cleanup Build Files
        working-directory: build
        run: |
          perl -i -ne 'print unless /TARGET_COMPILE_PDB/' clean_build.ninja
          perl -i -ne 'print unless /TARGET_COMPILE_PDB/' build.ninja
          perl -i -ne 'print unless /TARGET_PDB/' clean_build.ninja
          perl -i -ne 'print unless /TARGET_PDB/' build.ninja
          perl -i -ne 'print unless /DuckDBConfig.cmake.in/' clean_build.ninja
          perl -i -ne 'print unless /DuckDBConfig.cmake.in/' build.ninja

      - name: Compare Build Files
        working-directory: build
        run: |
          diff -u clean_build.ninja build.ninja
