name: Close Stale Issues
on:
  repository_dispatch:
  workflow_dispatch:

jobs:
  close_stale_issues:
    permissions:
      actions: write
      contents: write # only for delete-branch option
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Close stale issues
        uses: actions/stale@v9
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          stale-issue-message: 'This issue is stale because it has been open 365 days with no activity. Remove stale label or comment or this will be closed in 30 days.'
          close-issue-message: 'This issue was closed because it has been stale for 30 days with no activity.'
          exempt-issue-labels: 'no stale'
          days-before-issue-stale: 365
          days-before-issue-close: 30
          stale-issue-label: stale

          # Stale PRs are handled by duckdblabs/pr-tracker (it shares the `stale` label), so
          # this workflow must neither mark, close, nor un-mark PRs.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-pr-stale-when-updated: false

          operations-per-run: 500
