# Note: *will* override existing extensions, tread with care

name: Single Extension Build and Deploy
on:
  workflow_dispatch:
    inputs:
      extension_name:
        description: 'extension to deploy (using current config)'
        required: true
        type: string
      duckdb_version:
        description: 'DuckDB build version (empty for a local development version)'
        type: string
      duckdb_commit:
        description: 'DuckDB commit (empty for current commit)'
        type: string
        required: false
        default: ''
      extension_template_ref:
        description: 'The extension-template version to use (empty for vx.y-codename)'
        type: string
        required: false
        default: 'main'
      extra_exclude_archs:
        description: 'Inject more architectures to skip (optional)'
        type: string
        required: false
        default: ''
      skip_tests:
        description: 'Set to true to skip all testing (optional)'
        type: boolean
        required: false
        default: false
      extra_toolchains:
        description: 'extra toolchains (optional)'
        required: false
        type: string
        default: ""

env:
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}

jobs:
  load-extension-configs:
    name: Load Extension Config
    runs-on: ubuntu-latest
    outputs:
      extension_config: ${{ steps.set-extension.outputs.extension_config }}
      extension_exclude_archs: ${{ steps.set-extension.outputs.exclude_archs }}
    env:
      BASE_EXCLUDE_ARCHS: ''
      EXTRA_EXCLUDE_ARCHS: ${{ inputs.extra_exclude_archs }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: set-extension
        name: Configure extension
        env:
          EXT_CONFIG: .github/config/extensions/${{ inputs.extension_name }}.cmake
        run: |
          # Set config
          echo "exclude_archs=$DEFAULT_EXCLUDE_ARCHS;$BASE_EXCLUDE_ARCHS;$EXTRA_EXCLUDE_ARCHS" >> "$GITHUB_OUTPUT"
          ext_config="$(<"$EXT_CONFIG")"
          {
            echo "extension_config<<EOF"
            echo "$ext_config"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    name: Build Extension
    needs: load-extension-configs
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      override_repository: duckdb/extension-template
      override_ref: main
      upload_all_extensions: true
      extension_name: extensions
      reduced_ci_mode: auto
      set_caller_as_duckdb: true
      duckdb_version: ${{ inputs.duckdb_commit }}
      override_ci_tools_repository: duckdb/extension-ci-tools
      ci_tools_version: main
      exclude_archs: ${{ needs.load-extension-configs.outputs.extension_exclude_archs }}
      opt_in_archs: ''
      extra_toolchains: 'rust'
      use_merged_vcpkg_manifest: '1'
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
      duckdb_tag: ${{ inputs.duckdb_version }}
      skip_tests: ${{ inputs.skip_tests && true || false }}
      save_cache: true
      extensions_test_selection: 'complete'
      extra_extension_config: ${{ needs.load-extension-configs.outputs.extension_config }}

  # Merge all extensions into a single, versioned repository
  create-extension-repository:
    name: Create Extension Repository
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        name: Download extensions
        with:
          pattern: extensions-${{ inputs.duckdb_commit }}*
          path: /tmp/repository_generation/extensions

      - name: Print all extensions
        run: |
          tree /tmp/repository_generation

      - name: Merge into single repository
        shell: bash
        run: |
          shopt -s nullglob
          for version_dir in /tmp/repository_generation/*/*/*; do
            version="$(basename "$version_dir")"
            for platform_dir in "$version_dir"/*; do
              platform="$(basename "$platform_dir")"
              mkdir -p /tmp/merged_repository/"$version"/"$platform"
              cp -r "$platform_dir"/. /tmp/merged_repository/"$version"/"$platform"
            done
          done
          tree /tmp/merged_repository

      - name: Remove all non-target extensions
        run: |
          find /tmp/merged_repository -type f ! -name "${{ inputs.extension_name }}.duckdb_extension*" -delete
          tree /tmp/merged_repository

      - uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: extension-repository-${{ inputs.duckdb_commit }}
          path: |
            /tmp/merged_repository/**/*.duckdb_extension*

  upload-extensions:
    name: Upload Extensions
    runs-on: ubuntu-latest
    needs:
      - create-extension-repository

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: extension-repository-${{ inputs.duckdb_commit }}
          path: /tmp

      - name: List extensions to deploy
        shell: bash
        run: |
          tree /tmp/extension-repository-${{ inputs.duckdb_commit }}

      - name: Deploy extensions
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.DUCKDB_CORE_EXTENSION_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{secrets.DUCKDB_CORE_EXTENSION_S3_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.DUCKDB_CORE_EXTENSION_S3_SECRET}}
          DUCKDB_DEPLOY_SCRIPT_MODE: for_real
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.DUCKDB_EXTENSION_SIGNING_PK }}
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://rclone.org/install.sh | sudo bash
          make upload-extensions EXTENSION_REPOSITORY_PATH=/tmp/extension-repository-${{ inputs.duckdb_commit }} EXTENSION_BUCKET=duckdb-staging
