name: Staged Upload
on:
  workflow_call:
    inputs:
      duckdb_commit:
        type: string
      duckdb_version:
        type: string
  workflow_dispatch:
    inputs:
      duckdb_commit:
        type: string
      duckdb_version:
        type: string

jobs:
 staged-upload:
   runs-on: ubuntu-latest
   if: ${{ inputs.duckdb_version != '' }}
   env:
     DUCKDB_COMMIT: ${{ inputs.duckdb_commit || github.sha }}
     DUCKDB_VERSION: ${{ inputs.duckdb_version }}
   steps:
     - uses: actions/checkout@v6
       with:
         fetch-depth: 0
         ref: ${{ inputs.duckdb_commit || github.sha }}

     - uses: actions/setup-python@v6
       with:
         python-version: '3.12'

     - name: Install
       shell: bash
       run: curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://rclone.org/install.sh | sudo bash

     - name: Download from staging bucket
       shell: bash
       env:
         AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
         AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
         AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
       run: |
          TARGET=$(printf '%s' "$DUCKDB_COMMIT" | cut -c1-10)
          mkdir to_be_uploaded
          s3_provider="AWS"
          if [[ "$AWS_ENDPOINT_URL" == *"r2.cloudflarestorage.com"* ]]; then
            s3_provider="Cloudflare"
          fi
          rclone copy \
            --no-traverse \
            ":s3,provider=${s3_provider},env_auth=true,endpoint='${AWS_ENDPOINT_URL}':duckdb-staging/$TARGET/$DUCKDB_VERSION/$GITHUB_REPOSITORY/github_release/" \
            to_be_uploaded/

     - name: Deploy
       if: ${{ inputs.duckdb_version != '' }}
       shell: bash
       env:
         AWS_ENDPOINT_URL: ${{ secrets.DUCKDB_INSTALL_S3_ENDPOINT }}
         AWS_ACCESS_KEY_ID: ${{ secrets.DUCKDB_INSTALL_S3_ID }}
         AWS_SECRET_ACCESS_KEY: ${{ secrets.DUCKDB_INSTALL_S3_SECRET }}
         GH_TOKEN: ${{ secrets.GH_TOKEN }}
       run: |
         GITHUB_REF="refs/tags/$DUCKDB_VERSION" python3 scripts/asset-upload-gha.py to_be_uploaded/*
         s3_provider="AWS"
         if [[ "$AWS_ENDPOINT_URL" == *"r2.cloudflarestorage.com"* ]]; then
           s3_provider="Cloudflare"
         fi
         rclone copy \
           --no-traverse \
           --ignore-times \
           --ignore-checksum \
           --no-check-dest \
           --s3-no-check-bucket \
           --s3-no-head \
           --header-upload "Content-Type: application/octet-stream" \
           to_be_uploaded/ \
           ":s3,provider=${s3_provider},env_auth=true,endpoint='${AWS_ENDPOINT_URL}':duckdb-install/$DUCKDB_VERSION/"
