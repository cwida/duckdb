name: OSX
on:
  workflow_call:
    inputs:
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      is_release_build:
        type: boolean
      runner_macos_arm64:
        type: string
      skip_tests:
        type: boolean
      run_all:
        type: boolean

concurrency:
  group: osx-${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}-${{ inputs.duckdb_version }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  DUCKDB_VERSION: ${{ inputs.duckdb_version }}
  DUCKDB_COMMIT: ${{ inputs.duckdb_commit }}

jobs:
  xcode-debug:
    name: OSX Debug
    runs-on: ${{ inputs.runner_macos_arm64 || 'macos-latest' }}

    env:
      TREAT_WARNINGS_AS_ERRORS: 1
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      GEN: ninja

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ inputs.duckdb_commit }}

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: ./.github/actions/ccache-action

    - name: Install ninja
      run: python3 scripts/ci/retry.py -- brew install ninja

    - uses: ./.github/actions/cleanup_runner

    - name: Build
      run: python3 scripts/ci/retry.py -- make

    - name: Set DUCKDB_INSTALL_LIB for ADBC tests
      shell: bash
      run: echo "DUCKDB_INSTALL_LIB=$(find "$PWD" -name 'libduck*.dylib' | head -n 1)" >> "$GITHUB_ENV"

    - name: Test DUCKDB_INSTALL_LIB variable
      run: echo "$DUCKDB_INSTALL_LIB"

    - name: Test
      if: ${{ !inputs.skip_tests }}
      run: make unittest_release

    # SQL navigation needs the query_break hook and locals that release builds optimize away.
    - name: Build debug executable for LLDB
      if: ${{ !inputs.skip_tests }}
      timeout-minutes: 60
      env:
        DISABLE_SHELL: 1
        # Debug enables extra conversion warnings; keep them non-fatal for the LLDB fixture build.
        TREAT_WARNINGS_AS_ERRORS: 0
        EXTRA_CMAKE_VARIABLES: -DTREAT_WARNINGS_AS_ERRORS=OFF
      run: python3 scripts/ci/retry.py -- make debug

    - name: LLDB helper tests
      id: lldb-tests
      if: ${{ !inputs.skip_tests }}
      timeout-minutes: 5
      run: |
        python3 scripts/lldb/tests/run_tests.py --unittest build/debug/test/unittest \
          --lldb "$(xcrun --find lldb)" \
          --coverage-dir build/lldb-coverage

    - name: Upload LLDB coverage
      if: ${{ !cancelled() && steps.lldb-tests.outcome != 'skipped' }}
      uses: actions/upload-artifact@v7
      with:
        name: lldb-coverage-osx
        path: build/lldb-coverage

  xcode-release:
    # Builds binaries for osx_arm64 and osx_amd64
    name: OSX Release
    runs-on: ${{ inputs.runner_macos_arm64 || 'macos-latest' }}
    env:
      EXTENSION_CONFIGS: '${GITHUB_WORKSPACE}/.github/config/bundled_extensions.cmake'
      DUCKDB_CAPABILITIES: 'httplib loadable_extensions'
      OSX_BUILD_UNIVERSAL: 1
      GEN: ninja

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.duckdb_commit }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: python3 scripts/ci/retry.py -- brew install ninja

      - uses: ./.github/actions/ccache-action

      - name: Install pytest
        run: |
          python3 scripts/ci/retry.py -- python -m pip install --break-system-packages pytest

      - name: Build
        run: python3 scripts/ci/retry.py -- make


      - name: CLI check
        run: |
          ./build/release/duckdb -c "PRAGMA platform; PRAGMA version;"
          if [[ "${{ inputs.is_release_build }}" == "true" ]]; then
            # Fail on a zero major version.
            ./build/release/duckdb -ascii -noheader -c "SELECT library_version FROM pragma_version() WHERE library_version NOT LIKE 'v0%'" | grep '^v';
          fi

      - name: Verify architecture flags
        run: grep -Fq -- '-Xarch_arm64 -mcpu=apple-m1' build/release/compile_commands.json

        #     from https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development
      - name: Sign Binaries
        if: github.repository == 'duckdb/duckdb' && github.event_name != 'pull_request'
        shell: bash
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.OSX_CODESIGN_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.OSX_CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.OSX_CODESIGN_KEYCHAIN_PASSWORD }}
          TEAM_ID : ${{ secrets.OSX_NOTARIZE_TEAM_ID }}
          APPLE_ID: ${{ secrets.OSX_NOTARIZE_APPLE_ID }}
          PASSWORD: ${{ secrets.OSX_NOTARIZE_PASSWORD }}
        run: |
          if [[ "$GITHUB_REPOSITORY" = "duckdb/duckdb" ]] ; then
            . scripts/osx_import_codesign_certificate.sh
            
            echo -e '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>com.apple.security.cs.disable-library-validation</key>\n  <true/>\n</dict>\n</plist>' > entitlements.plist
            codesign --options runtime --entitlements entitlements.plist --all-architectures --force --sign "Developer ID Application: Stichting DuckDB Foundation" build/release/duckdb
            codesign --options runtime --entitlements entitlements.plist --all-architectures --force --sign "Developer ID Application: Stichting DuckDB Foundation" build/release/src/libduckdb*.dylib
          
            zip -j notarize.zip build/release/duckdb build/release/src/libduckdb.dylib 
            XCRUN_RESPONSE=$(xcrun notarytool submit --progress --apple-id "$APPLE_ID" --password "$PASSWORD" --team-id "$TEAM_ID" --wait -f json notarize.zip)
            export XCRUN_RESPONSE
            rm notarize.zip
            if [[ $(./build/release/duckdb -csv -noheader -c "SELECT (getenv('XCRUN_RESPONSE')::JSON)->>'status'") != "Accepted" ]] ; then 
              echo "Notarization failed!"
              echo "$XCRUN_RESPONSE"
              exit 1
            fi
          fi

      - name: Deploy
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
        run: |
          mkdir -p \
            build/release_arm64/libs \
            build/release_arm64/src \
            build/release_arm64/test/extension \
            build/release_amd64/libs \
            build/release_amd64/src \
            build/release_amd64/test/extension
          lipo -extract arm64 -output build/release_arm64/duckdb build/release/duckdb
          lipo -extract x86_64 -output build/release_amd64/duckdb build/release/duckdb
          lipo -extract arm64 -output build/release_arm64/test/unittest build/release/test/unittest
          lipo -extract x86_64 -output build/release_amd64/test/unittest build/release/test/unittest
          cp -p build/release/test/run build/release_arm64/test/run
          cp -p build/release/test/run build/release_amd64/test/run

          for extension in build/release/test/extension/*.duckdb_extension; do
            extension_name="$(basename "$extension")"
            lipo -extract arm64 -output "build/release_arm64/test/extension/$extension_name" "$extension"
            lipo -extract x86_64 -output "build/release_amd64/test/extension/$extension_name" "$extension"
          done

          for library in build/release/src/libduckdb*.dylib; do
            library_name="$(basename "$library")"
            if [[ -L "$library" ]]; then
              library_target="$(readlink "$library")"
              ln -s "$library_target" "build/release_arm64/src/$library_name"
              ln -s "$library_target" "build/release_amd64/src/$library_name"
              continue
            fi
            lipo -extract arm64 -output "build/release_arm64/src/$library_name" "$library"
            lipo "build/release_arm64/src/$library_name" -verify_arch arm64
            lipo -extract x86_64 -output "build/release_amd64/src/$library_name" "$library"
            lipo "build/release_amd64/src/$library_name" -verify_arch x86_64
          done

          for library in build/release/src/libduckdb_static.a build/release/src/libduckdb_shell.a build/release/src/main/http/libduckdb_httplib.a build/release/src/main/extension/libduckdb_loadable_extensions.a build/release/extension/*/lib*_extension.a; do
            library_name="$(basename "$library")"
            lipo -extract arm64 -output "build/release_arm64/libs/$library_name" "$library"
            lipo "build/release_arm64/libs/$library_name" -verify_arch arm64
            lipo -extract x86_64 -output "build/release_amd64/libs/$library_name" "$library"
            lipo "build/release_amd64/libs/$library_name" -verify_arch x86_64
          done

          # Relink each arch: universal extensions are double-sized, and lipo -thin drops the metadata footer.
          prebuilt_extensions=()
          loadable_targets=()
          for library in build/release_arm64/libs/lib*_extension.a; do
            extension_name="$(basename "$library")"
            extension_name="${extension_name#lib}"
            extension_name="${extension_name%_extension.a}"
            prebuilt_extensions+=("$extension_name")
            loadable_targets+=("${extension_name}_loadable_extension")
          done
          prebuilt_extension_list="$(IFS=';'; echo "${prebuilt_extensions[*]}")"

          for target in arm64:arm64:osx_arm64 amd64:x86_64:osx_amd64; do
            IFS=: read -r dir_arch lipo_arch platform <<< "$target"
            extension_build_dir="build/release_${dir_arch}/core_extensions"
            cmake -S . -B "$extension_build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DOSX_BUILD_ARCH="$lipo_arch" \
              -DBUILD_UNITTESTS=OFF \
              -DBUILD_BENCHMARKS=OFF \
              -DBUILD_SHELL=OFF \
              -DDUCKDB_EXPLICIT_PLATFORM="$platform" \
              -DPREBUILT_BINARY="$PWD/build/release_${dir_arch}/libs/libduckdb_static.a" \
              -DPREBUILT_EXTENSIONS="$prebuilt_extension_list" \
              -DDUCKDB_EXTENSION_CONFIGS="$PWD/.github/config/bundled_extensions.cmake"
            cmake --build "$extension_build_dir" --target "${loadable_targets[@]}"
            cmake --build "$extension_build_dir" --target duckdb_local_extension_repo

            for extension in "$extension_build_dir"/repository/*/*/*.duckdb_extension; do
              if [[ "$(lipo -archs "$extension")" != "$lipo_arch" ]]; then
                echo "Expected thin $lipo_arch extension: $extension ($(lipo -archs "$extension"))"
                exit 1
              fi
            done
            cp -a "$extension_build_dir/repository" "build/release_${dir_arch}/"
          done

          make cli-release-artifact ARTIFACT_SUFFIX=osx-universal CLI_BINARY=build/release/duckdb
          make cli-release-artifact ARTIFACT_SUFFIX=osx-arm64 CLI_BINARY=build/release_arm64/duckdb
          make cli-release-artifact ARTIFACT_SUFFIX=osx-amd64 CLI_BINARY=build/release_amd64/duckdb
          make shared-libs-release-artifact ARTIFACT_SUFFIX=osx-universal SHARED_LIBRARIES="build/release/src/libduckdb*.dylib"
          make shared-libs-release-artifact ARTIFACT_SUFFIX=osx-arm64 SHARED_LIBRARIES="build/release_arm64/src/libduckdb*.dylib"
          make shared-libs-release-artifact ARTIFACT_SUFFIX=osx-amd64 SHARED_LIBRARIES="build/release_amd64/src/libduckdb*.dylib"
          make static-libs-release-artifact ARTIFACT_SUFFIX=osx-arm64 STATIC_LIBRARIES="build/release_arm64/libs/*"
          make static-libs-release-artifact ARTIFACT_SUFFIX=osx-amd64 STATIC_LIBRARIES="build/release_amd64/libs/*"

          ./scripts/upload-assets-to-staging.sh github_release \
            duckdb-cli-osx-universal.tar.gz \
            duckdb-cli-osx-arm64.tar.gz \
            duckdb-cli-osx-amd64.tar.gz \
            duckdb-shared-libs-osx-universal.tar.gz \
            duckdb-shared-libs-osx-arm64.tar.gz \
            duckdb-shared-libs-osx-amd64.tar.gz \
            duckdb-static-libs-osx-arm64.tar.gz \
            duckdb-static-libs-osx-amd64.tar.gz

          make release-artifact \
            RELEASE_ARTIFACT_SOURCE_DIR=build/release_arm64 \
            RELEASE_ARTIFACT_TARBALL=build/release-artifacts/osx-release-arm64-build.tar.gz
          make release-artifact \
            RELEASE_ARTIFACT_SOURCE_DIR=build/release_amd64 \
            RELEASE_ARTIFACT_TARBALL=build/release-artifacts/osx-release-amd64-build.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-cli-osx-universal.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-cli-osx-arm64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-cli-osx-amd64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-shared-libs-osx-universal.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-shared-libs-osx-arm64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-shared-libs-osx-amd64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-static-libs-osx-arm64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: duckdb-static-libs-osx-amd64.tar.gz
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          name: release-core-extensions-osx-arm64
          path: build/release_arm64/core_extensions/repository
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: release-core-extensions-osx-amd64
          path: build/release_amd64/core_extensions/repository
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: build/release-artifacts/osx-release-arm64-build.tar.gz
          if-no-files-found: error
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: build/release-artifacts/osx-release-amd64-build.tar.gz
          if-no-files-found: error
          archive: false

      - name: Unit Test
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: make allunit

      - name: Tools Tests
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: |
          python -m pytest tools/shell/tests --shell-binary build/release/duckdb

      - name: Unittest Stdin Tests
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: |
          python -m pytest tools/sqllogic/tests --unittest-binary build/release/test/unittest

      - name: Examples
        shell: bash
        if: ${{ !inputs.skip_tests }}
        run: |
          (cd examples/embedded-c; make)
          (cd examples/embedded-c++; make)
