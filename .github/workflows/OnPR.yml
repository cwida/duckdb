name: OnPR
on:
  pull_request_target:
    types: [opened]

concurrency:
  group: onpr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  apply:
    name: Apply PR actions
    if: contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: namespace-profile-linux-slim;job.priority=1
    timeout-minutes: 10

    # WARNING: This workflow runs with base-repository privileges.
    # Do not check out PR code, execute PR scripts, or read PR files as trusted input.
    # Keep this workflow metadata/API-only.

    steps:
      - name: Add Member label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels: ['Member']
            });
            core.info(`Added Member label to PR #${pr.number}`);
