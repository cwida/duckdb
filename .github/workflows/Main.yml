 linux-release-musl:
    name: Linux Release (musl, ${{ matrix.config.name }})
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-release-musl') }}
    needs: prepare
    continue-on-error: ${{ needs.prepare.outputs.staged_version != '' }}
