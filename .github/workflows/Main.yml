 no-string-inline:
    name: No String Inline / Destroy Unpinned Blocks
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'no-string-inline') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-relassert
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
      DUCKDB_TEST_DESCRIPTION: 'Compiled with ALTERNATIVE_VERIFY=1 DISABLE_STRING_INLINE=1 DESTROY_UNPINNED_BLOCKS=1 DISABLE_POINTER_SALT=1. Use require no_alternative_verify to skip.'

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          ref: ${{ needs.prepare.outputs.duckdb_commit }}

      - uses: ./.github/actions/ccache-action
        with:
          save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          CRASH_ON_ASSERT: 1
          FORCE_DEBUG: 1
          FORCE_ASSERT: 1
          EXPORT_DYNAMIC_SYMBOLS: 1
          REDUCE_SYMBOLS: 1
          EXTENSION_STATIC_BUILD: 0
          CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
          LINK_CORE_EXTENSIONS: 1
          DISABLE_STRING_INLINE: 1
          DESTROY_UNPINNED_BLOCKS: 1
          ALTERNATIVE_VERIFY: 1
          DISABLE_POINTER_SALT: 1
        with:
          build-type: relassert
          build: python3 scripts/ci/retry.py -- make relassert
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
          cache-suffix: no_string_inline
          save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Test
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: |
          export LSAN_OPTIONS="suppressions=$PWD/.sanitizer-leak-suppressions.txt"
          make unittest_relassert

 no-rtti:
    name: No RTTI
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'no-rtti') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-relassert
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
      # Job-level on purpose: the Test step's `make unittest_release` depends on `release`, so a
      # step-scoped flag would silently reconfigure and rebuild WITH rtti and test the wrong binary.
      DISABLE_RTTI: 1
      # Compile with C++23 to test compatibility with the newer standard.
      CXX_STANDARD: 23
      EXTENSION_CONFIGS: .github/config/in_tree_extensions.cmake
      DUCKDB_TEST_DESCRIPTION: 'Compiled with DISABLE_RTTI=1 (-fno-rtti).'

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          ref: ${{ needs.prepare.outputs.duckdb_commit }}

      - uses: ./.github/actions/ccache-action
        with:
          save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Build
        uses: duckdb/duckdb-ci/build-duckdb@main
        with:
          build-type: release
          build: python3 scripts/ci/retry.py -- make release
          vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
          cache-suffix: no_rtti
          save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      # Loadable extensions are the part a plain build cannot check: each one links its own
      # copy of duckdb, so a type identity that is not stable across images only fails here.
      - name: Test
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: make unittest_release

 vector-sizes:
    name: Vector Sizes
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'vector-sizes') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).ubuntu_24_04_amd64_compat }}
    needs:
      - prepare
      - linux-relassert
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
      # Explicitly use GCC (11!) here to check compiler support in a PR CI run.
      # Other CI job use Clang but GCC (11+) should continue to work well.
      CC: gcc
      CXX: g++
      GEN: ninja
      DUCKDB_TEST_DESCRIPTION: 'Compiled with STANDARD_VECTOR_SIZE=2. Use require vector_size 2048 to skip tests.'

    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          ref: ${{ needs.prepare.outputs.duckdb_commit }}

      - uses: ./.github/actions/ccache-action
        with:
          save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

      - name: Build
        run: STANDARD_VECTOR_SIZE=2 make reldebug

      - name: Test
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: make unittest_reldebug

 threadsan:
    name: Thread Sanitizer
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'threadsan') }}
    needs:
      - prepare
      - linux-relassert
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
      TSAN_OPTIONS: suppressions=.sanitizer-thread-suppressions.txt:external_symbolizer_path=/usr/bin/llvm-symbolizer
      DUCKDB_TEST_DESCRIPTION: 'Tests run with thread sanitizer.'

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.duckdb_commit }}

    - uses: ./.github/actions/ccache-action
      with:
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Build threadsan
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        BUILD_JEMALLOC: 1
        THREADSAN: 1
        CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
      with:
        build-type: reldebug
        build: python3 scripts/ci/retry.py -- make reldebug
        vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
        cache-suffix: threadsan
        save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Test
      if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
      run: make unittest_threadsan

    - name: Test Extra
      if: ${{ fromJson(needs.prepare.outputs.is_release_build) && !fromJson(needs.prepare.outputs.skip_tests) }}
      run: make unittest_threadsan_extra

 # TODO: Consider bringing back fts
 # TODO: DEBUG_STACKTRACE: 1 + reldebug ?
 linux-configs:
    name: Linux Config (${{ matrix.group }})
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-configs') }}
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    needs:
      - prepare
      - linux-release
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Query Verification
            target: test_configs_query_verification
          - group: Execution
            target: test_configs_execution
          - group: Persistence
            target: test_configs_persistence
          - group: Storage Engine
            target: test_configs_storage_engine

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.duckdb_commit }}

    - name: Download linux release artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-release-build.tar.gz
        path: build

    - name: Extract linux release artifact
      run: |
        rm -rf build/release
        tar -xzf build/linux-release-build.tar.gz -C build

    - name: Test Configurations
      if: success() || failure()
      run: |
        make ${{ matrix.target }}

    - name: Test Storage Compatibility
      if: ${{ (success() || failure()) && matrix.group == 'Persistence' }}
      run: |
        make test_storage

    - name: Test Vector Verification
      if: ${{ (success() || failure()) && matrix.group == 'Execution' }}
      run: |
        make test_vector

    - name: Test Synchronous Table Scan
      if: ${{ (success() || failure()) && matrix.group == 'Execution' }}
      run: |
        make test_table_scan

 summary:
    name: Summary
    if: ${{ always() }}
    # No fromJSON here: when prepare is skipped (draft PRs, non-member synchronize) its outputs are
    # empty and fromJSON('') makes the whole run fail with every job skipped.
    runs-on: ${{ needs.prepare.outputs.runner_linux_slim || 'ubuntu-slim' }}
    needs:
      - prepare
      - linux-relassert
      - linux-relassert-tests
      - regression
      - tidy-check
      - extensions-build
      - extensions-deploy
      - wasm-eh
      - linux-release
      - codecov
      - linux-release-tests
      - linux-release-musl
      - extensions-install
      - swift
      - windows
      - osx
      - no-string-inline
      - no-rtti
      - vector-sizes
      - threadsan
      - linux-configs
    steps:
      - id: release-status
        name: Compute release status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [[ "${{ needs.extensions-deploy.result }}" == "success" && \
                "${{ needs.osx.result }}" == "success" && \
                "${{ needs.windows.result }}" == "success" && \
                "${{ needs.linux-release.result }}" == "success" && \
                "${{ needs.linux-release-musl.result }}" == "success" ]]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - id: summary-context
        name: Compute summary dispatch context
        if: ${{ always() }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
          STAGED_VERSION: ${{ needs.prepare.outputs.staged_version }}
          RELEASE_STATUS_SUCCESS: ${{ steps.release-status.outputs.success || 'false' }}
          CURRENT_REF: ${{ github.ref }}
          ALPHA_BRANCH: 'v2.0-cyanoptera'
        run: |
          is_release_event=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            is_release_event=true
          fi

          is_duckdb_repo=false
          if [[ "$REPOSITORY" == "duckdb/duckdb" ]]; then
            is_duckdb_repo=true
          fi

          run_release_dispatch=false
          if [[ "$is_release_event" == "true" && "$is_duckdb_repo" == "true" && "$RELEASE_STATUS_SUCCESS" == "true" && -n "$DUCKDB_VERSION" ]]; then
            run_release_dispatch=true
          fi

          is_default_branch=false
          if [[ "$CURRENT_REF" == "refs/heads/$ALPHA_BRANCH" ]]; then
            is_default_branch=true
          fi

          publish_latest_alpha=false
          if [[ "$is_duckdb_repo" == "true" && "$is_default_branch" == "true" && "$RELEASE_STATUS_SUCCESS" == "true" && -n "$STAGED_VERSION" ]]; then
            publish_latest_alpha=true
          fi

          echo "summary dispatch context:"
          echo "  event_name=$EVENT_NAME"
          echo "  repository=$REPOSITORY"
          echo "  duckdb_version=$DUCKDB_VERSION"
          echo "  release_status_success=$RELEASE_STATUS_SUCCESS"
          echo "  is_release_event=$is_release_event"
          echo "  is_duckdb_repo=$is_duckdb_repo"
          echo "  run_release_dispatch=$run_release_dispatch"
          echo "  staged_version=$STAGED_VERSION"
          echo "  current_ref=$CURRENT_REF"
          echo "  alpha_branch=$ALPHA_BRANCH"
          echo "  is_default_branch=$is_default_branch"
          echo "  publish_latest_alpha=$publish_latest_alpha"

          {
            echo "run_release_dispatch=$run_release_dispatch"
            echo "publish_latest_alpha=$publish_latest_alpha"
          } >> "$GITHUB_OUTPUT"

      - name: Run release dispatch
        if: ${{ always() && steps.summary-context.outputs.run_release_dispatch == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          SOURCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh workflow run dispatch.yml \
            --repo duckdb/duckdb-workflow-trigger \
            --ref main \
            --field event=core_ready \
            --field duckdb_version="${{ needs.prepare.outputs.duckdb_version }}" \
            --field duckdb_commit="${{ needs.prepare.outputs.duckdb_commit }}" \
            --field status=success \
            --field source_run_url="$SOURCE_RUN_URL" \
            --field message="DuckDB Main CI release artifacts are ready"

      - name: Check CI status
        shell: bash
        run: |
          NEEDS_JSON='${{ toJSON(needs) }}'

          failed_or_cancelled=$(
            jq -r '
              to_entries[]
              | select(.value.result == "failure" or .value.result == "cancelled")
              | "\(.key): \(.value.result)"
            ' <<<"$NEEDS_JSON"
          )

          if [[ -n "$failed_or_cancelled" ]]; then
            echo "One or more required jobs failed or were cancelled."
            echo "$failed_or_cancelled"
            exit 1
          fi

      - name: Install rclone
        if: ${{ steps.summary-context.outputs.publish_latest_alpha == 'true' }}
        shell: bash
        run: curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 https://rclone.org/install.sh | sudo bash

      - name: Publish latest alpha version
        if: ${{ steps.summary-context.outputs.publish_latest_alpha == 'true' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.S3_DUCKDB_STAGING_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_DUCKDB_STAGING_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_DUCKDB_STAGING_KEY }}
          BRANCH: ${{ github.ref_name }}
          DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
          DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
          STAGED_VERSION: ${{ needs.prepare.outputs.staged_version }}
        run: |
          set -euo pipefail

          pointer_file="$(mktemp "${TMPDIR:-/tmp}/latest-alpha-version.XXXXXX")"
          trap 'rm -f "$pointer_file"' EXIT
          printf '%s\n' "$STAGED_VERSION" > "$pointer_file"

          s3_provider="AWS"
          if [[ "$AWS_ENDPOINT_URL" == *"r2.cloudflarestorage.com"* ]]; then
            s3_provider="Cloudflare"
          fi

          rclone copyto \
            --s3-provider "$s3_provider" \
            --s3-endpoint "$AWS_ENDPOINT_URL" \
            --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
            --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket \
            --s3-no-head \
            --header-upload "Content-Type: text/plain" \
            --header-upload "Cache-Control: no-cache" \
            "$pointer_file" \
            ":s3:duckdb-staging/latest_alpha_version.txt"

          rclone copyto \
            --s3-provider "$s3_provider" \
            --s3-endpoint "$AWS_ENDPOINT_URL" \
            --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
            --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket \
            --s3-no-head \
            --header-upload "Content-Type: text/plain" \
            --header-upload "Cache-Control: no-cache" \
            "$pointer_file" \
            ":s3:duckdb-staging/release/$BRANCH/latest_alpha_version.txt"

          target="${DUCKDB_COMMIT:0:10}"
          printf '%s\n' "$DUCKDB_VERSION" > "$pointer_file"

          rclone copyto \
            --s3-provider "$s3_provider" \
            --s3-endpoint "$AWS_ENDPOINT_URL" \
            --s3-access-key-id "$AWS_ACCESS_KEY_ID" \
            --s3-secret-access-key "$AWS_SECRET_ACCESS_KEY" \
            --s3-no-check-bucket \
            --s3-no-head \
            --header-upload "Content-Type: text/plain" \
            --header-upload "Cache-Control: no-cache" \
            "$pointer_file" \
            ":s3:duckdb-staging/$target/latest_alpha_version.txt"
