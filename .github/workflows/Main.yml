name: Main
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch' &&
    format('Main ({0})', inputs.duckdb_version || format('alpha{0}', github.run_number)) ||
    ''
  }}
on:
  workflow_dispatch:
    inputs:
      duckdb_version:
        type: string
      duckdb_commit:
        type: string
      skip_tests:
        type: boolean
        default: false
      run_all:
        type: boolean
        default: true
      extension_exclude_archs:
        description: 'Extra extension archs to skip, separated by ";" (e.g. windows_amd64)'
        type: string
        default: ''
  push:
    branches-ignore:
      - 'main'
      - 'feature'
      - 'v*.*-*'
      - 'gh-readonly-queue/**'
  merge_group:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/v')) || github.run_id }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  # Override extension CI matrix reduction with "enabled" or "disabled".
  # Use "disabled" on risky PRs to run the full extension matrix.
  # OVERRIDE_REDUCED_CI_MODE: disabled
  # Run only specific jobs in CI (separated by whitespace) and skip the rest.
  #
  # Add the CI job's `needs:` list here as well. Otherwise, those are skipped
  # and the dependent job is also skipped.
  #
  # For example, to build and deploy extensions, use:
  # OVERRIDE_JOBS: linux-relassert linux-release linux-release-musl windows extensions-build extensions-deploy
  # Add "osx" when running the full extension matrix.

jobs:
 prepare:
    # We run all other jobs on PRs only if they are not draft PR
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      (github.event.action != 'synchronize' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: ${{ github.repository == 'duckdb/duckdb' && 'namespace-profile-linux-slim;job.priority=1' || 'ubuntu-latest' }}
    outputs:
      duckdb_commit: ${{ steps.version.outputs.duckdb_commit }}
      runner_linux_slim: ${{ fromJSON(steps.config.outputs.runners).linux_slim }}
      runner_linux_small: ${{ fromJSON(steps.config.outputs.runners).linux_small }}
      runner_linux_x64: ${{ fromJSON(steps.config.outputs.runners).linux_x64 }}
      runner_linux_22_x64: ${{ fromJSON(steps.config.outputs.runners).linux_22_x64 }}
      runner_linux_arm64: ${{ fromJSON(steps.config.outputs.runners).linux_arm64 }}
      runner_windows_2022_x64: ${{ fromJSON(steps.config.outputs.runners).windows_2022_x64 }}
      runner_macos_arm64: ${{ fromJSON(steps.config.outputs.runners).macos_arm64 }}
      runner_macos_14_arm64: ${{ fromJSON(steps.config.outputs.runners).macos_14_arm64 }}
      runners: ${{ steps.config.outputs.runners }}
      images: ${{ steps.config.outputs.images }}
      image_version: ${{ steps.config.outputs.image_version }}
      linux_release_matrix: ${{ steps.config.outputs.linux_release_matrix }}
      linux_musl_matrix: ${{ steps.config.outputs.linux_musl_matrix }}
      extensions_changed: ${{ steps.changed.outputs.extensions_any_changed }}
      extension_opt_in_archs: ${{ steps.config.outputs.extension_opt_in_archs }}
      changed_tests_files: ${{ steps.changed.outputs.tests_all_changed_files }}
      changed_slow_tests_files: ${{ steps.changed.outputs.tests_slow_all_changed_files }}
      run_slow_tests: ${{ steps.config.outputs.run_slow_tests }}
      extensions_extra_exclude_archs: ${{ steps.config.outputs.extra_exclude_archs }}
      enabled_jobs: ${{ steps.config.outputs.enabled_jobs }}
      save_cache: ${{ steps.config.outputs.save_cache }}
      reduced_ci_mode: ${{ steps.config.outputs.reduced_ci_mode }}
      windows_full_matrix: ${{ steps.config.outputs.windows_full_matrix }}
      runner_provider: ${{ steps.runners.outputs.runner_provider }}
      skip_tests: ${{ steps.config.outputs.skip_tests }}
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
      is_release_build: ${{ steps.version.outputs.is_release_build }}
      staged_version: ${{ steps.version.outputs.staged_version }}
      extension_allow_failure_archs: ${{ steps.version.outputs.extension_allow_failure_archs }}
    env:
      GEN: ninja
    steps:
      - name: Detect runners
        id: runners
        uses: duckdb/duckdb-ci/detect-runners@main

      - name: Resolve DuckDB commit
        id: resolve_duckdb_commit
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.duckdb_commit }}" ]]; then
            resolved_commit="$(gh api -X GET "/repos/${{ github.repository }}/commits" -f sha="${{ inputs.duckdb_commit }}" -f per_page=1 --jq '.[0].sha')"
          else
            resolved_commit="${{ github.sha }}"
          fi
          echo "duckdb_commit=$resolved_commit" >> "$GITHUB_OUTPUT"
          echo "Using duckdb_commit=$resolved_commit"

      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ steps.runners.outputs.runner_provider }}
          fetch_depth: 0
          ref: ${{ steps.resolve_duckdb_commit.outputs.duckdb_commit }}

      - name: Resolve DuckDB version
        id: version
        shell: bash
        env:
          RESOLVED_COMMIT: ${{ steps.resolve_duckdb_commit.outputs.duckdb_commit }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.duckdb_version || '' }}
        run: |
          alpha_args=()
          staged_version=""
          extension_allow_failure_archs=
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.duckdb_commit }}" && -z "$INPUT_VERSION" ]]; then
            alpha_args=(--alpha-run-number "${{ github.run_number }}")
            extension_allow_failure_archs="windows_arm64;osx_amd64;windows_amd64_mingw;linux_amd64_musl;linux_arm64_musl"
          fi
          version_output="$(python3 scripts/ci/version.py \
            --duckdb-commit "$RESOLVED_COMMIT" \
            --duckdb-version "$INPUT_VERSION" \
            "${alpha_args[@]}" \
            --github-output)"
          printf '%s\n' "$version_output" >> "$GITHUB_OUTPUT"
          duckdb_version="$(sed -n 's/^duckdb_version=//p' <<<"$version_output")"
          if [[ ${#alpha_args[@]} -gt 0 ]]; then
            staged_version="${RESOLVED_COMMIT:0:10}/$duckdb_version"
          fi
          {
            echo "staged_version=$staged_version"
            echo "extension_allow_failure_archs=$extension_allow_failure_archs"
          } >> "$GITHUB_OUTPUT"
          echo "Using duckdb_commit=$RESOLVED_COMMIT"
          echo "Using duckdb_version=$duckdb_version"
          echo "Using staged_version=$staged_version"
          echo "Using extension_allow_failure_archs=$extension_allow_failure_archs"

      - name: Detect changes
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          separator: "\n"
          safe_output: false
          write_output_files: true
          output_dir: .github/outputs
          files_yaml: |
            github:
              - .github/**
            osx:
              - '.github/workflows/OSX.yml'
              - scripts/lldb/**
              - tools/swift/**
            extensions:
              - .github/config/**
              - .github/patches/**
            tests:
              - test/**/*.test
            tests_slow:
              - test/**/*.cpp
              - test/**/*.test_slow
            format:
              - CMakeLists.txt
              - src/**
              - benchmark/**
              - test/**
              - tools/**
              - examples/**
              - extension/**
              - scripts/**

      - name: Lint CI
        if: steps.changed.outputs.github_any_changed == 'true'
        timeout-minutes: 10
        uses: duckdb/duckdb-ci/lint-ci@main

      - name: Configure CI
        id: config
        shell: bash
        env:
          CHANGED_KEYS: ${{ steps.changed.outputs.changed_keys }}
          INPUT_EXCLUDE_ARCHS: ${{ github.event_name == 'workflow_dispatch' && inputs.extension_exclude_archs || '' }}
        run: |
          skip_tests="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests || 'false' }}"
          python3 scripts/ci/job_stages.py \
            --event "${{ github.event_name }}" \
            --ref_name "${{ github.ref_name }}" \
            --default_branch "${{ github.event.repository.default_branch }}" \
            --repository "${{ github.repository }}" \
            --skip-tests "$skip_tests" \
            --changed-keys "$CHANGED_KEYS" \
            --reduced-ci-mode "${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.run_all)) && 'enabled' || 'disabled' }}" \
            --run-all "${{ github.event_name != 'workflow_dispatch' || inputs.run_all }}" \
            --runners '${{ steps.runners.outputs.runners }}' \
            --runner-provider '${{ steps.runners.outputs.runner_provider }}'

          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            extra_exclude_archs=
          elif [[ "${{ steps.changed.outputs.extensions_any_changed }}" == "true" ]]; then
            extra_exclude_archs="osx_amd64"
          else
            extra_exclude_archs="windows_arm64;osx_amd64;wasm_eh"
          fi
          if [[ -n "$INPUT_EXCLUDE_ARCHS" ]]; then
            extra_exclude_archs="${extra_exclude_archs:+$extra_exclude_archs;}$INPUT_EXCLUDE_ARCHS"
          fi

          echo "extra_exclude_archs=$extra_exclude_archs" >> "$GITHUB_OUTPUT"

          if [[ "${{ steps.changed.outputs.tests_slow_any_changed }}" == "true" || "${{ steps.version.outputs.is_release_build }}" == "true" ]]; then
            run_slow_tests=true
          else
            run_slow_tests=false
          fi
          echo "run_slow_tests=$run_slow_tests" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$skip_tests" >> "$GITHUB_OUTPUT"

          image_version="$(<scripts/ci/image_version.txt)"

          images=$(
            jq -nc --arg image_version "$image_version" \
              '{
                manylinux_amd64_main: ("ghcr.io/duckdb/duckdb-ci/manylinux_2_28_amd64_main:" + $image_version),
                manylinux_arm64_main: ("ghcr.io/duckdb/duckdb-ci/manylinux_2_28_aarch64_main:" + $image_version),
                alpine_amd64_main: ("ghcr.io/duckdb/duckdb-ci/alpine_3_22_amd64_main:" + $image_version),
                alpine_arm64_main: ("ghcr.io/duckdb/duckdb-ci/alpine_3_22_aarch64_main:" + $image_version),
                ubuntu_24_04_amd64_compat: ("ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_compat:" + $image_version),
                ubuntu_24_04_amd64_lint: ("ghcr.io/duckdb/duckdb-ci/ubuntu_24_04_amd64_lint:" + $image_version)
              }'
          )

          grep -E '^(extra_exclude_archs|runner_)' "$GITHUB_OUTPUT"
          {
            echo "image_version=$image_version"
            echo "images=$images"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run prepare checks
        timeout-minutes: 10
        run: |
          python3 scripts/ci/retry.py --timeout 2m -- make -j4 prepare_tools
          # the file list can exceed the size limit of an environment variable
          if [ -f .github/outputs/format_all_changed_files.txt ]; then
            cp .github/outputs/format_all_changed_files.txt "$RUNNER_TEMP/changed-format-files.txt"
          else
            : > "$RUNNER_TEMP/changed-format-files.txt"
          fi
          PYTHON=.cache/prepare-venv/bin/python \
            make test_ci generate-files extension-patch-check -j "$(nproc)" -Otarget
          PYTHON=.cache/prepare-venv/bin/python \
            FORMAT_FILES_FROM="$RUNNER_TEMP/changed-format-files.txt" \
            make format-check-files enum-integrity-check -j "$(nproc)" -Otarget
          echo "::group::Check generated files"
          git diff --exit-code
          echo "::endgroup::"

 linux-relassert:
    name: Linux Relassert
    # This tests release build while enabling slow verifiers (masked by #ifdef DEBUG) and sanitizers
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-relassert') }}
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
      TREAT_WARNINGS_AS_ERRORS: 1
      GEN: ninja
      CRASH_ON_ASSERT: 1
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      EXPORT_DYNAMIC_SYMBOLS: 1
      REDUCE_SYMBOLS: 1
      EXTENSION_STATIC_BUILD: 0

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
        ref: ${{ needs.prepare.outputs.duckdb_commit }}

    - uses: ./.github/actions/ccache-action
      with:
        save: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Write changed tests file
      shell: bash
      env:
        CHANGED_TESTS_FILES: ${{ needs.prepare.outputs.changed_tests_files }}
      run: printf '%s\n' "$CHANGED_TESTS_FILES" | sed '/^$/d' > "$RUNNER_TEMP/changed_tests.txt"

    - name: Build DuckDB
      uses: duckdb/duckdb-ci/build-duckdb@main
      env:
        CORE_EXTENSIONS: "icu;tpch;tpcds;fts;json;inet;parquet;autocomplete;httpfs"
        LINK_CORE_EXTENSIONS: 1
      with:
        build-type: relassert
        build: python3 scripts/ci/retry.py -- make relassert
        vcpkg-commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
        test: make smoke T="--changed-tests=$RUNNER_TEMP/changed_tests.txt"
        bundle: make relassert-artifact
        upload-name: linux-relassert-build
        upload-path: build/relassert-artifact.tar.gz
        save-cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}

    - name: Output version info
      run: ./build/relassert/duckdb -c "PRAGMA version;"

 linux-relassert-tests:
    name: Linux Relassert Tests
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'linux-relassert-tests') }}
    needs:
      - prepare
      - linux-relassert
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).manylinux_amd64_main }}
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        ref: ${{ needs.prepare.outputs.duckdb_commit }}
    - name: Download relassert build artifact
      uses: actions/download-artifact@v8
      with:
        name: linux-relassert-build
        path: build

    - name: Extract relassert build artifact
      run: |
        rm -rf build/relassert
        tar -xzf build/relassert-artifact.tar.gz -C build
        ls -lh build/relassert/test/unittest

    - name: Set DUCKDB_INSTALL_LIB for ADBC tests
      run: echo "DUCKDB_INSTALL_LIB=$(find "$PWD" -name 'libduck*.so' | head -n 1)" >> "$GITHUB_ENV"

    - name: Test DUCKDB_INSTALL_LIB variable
      run: echo "$DUCKDB_INSTALL_LIB"

    - name: Test
      run: make unittest_relassert

    - name: Test Benchmark SQL
      run: make test_benchmark_sql

 regression:
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'regression') }}
    uses: ./.github/workflows/Regression.yml
    secrets: inherit
    needs:
      - prepare
      - linux-relassert
      - linux-release
    with:
      duckdb_commit: ${{ needs.prepare.outputs.duckdb_commit }}
      duckdb_version: ${{ needs.prepare.outputs.duckdb_version }}
      build_current_release: false
      run_slow_tests: ${{ needs.prepare.outputs.run_slow_tests == 'true' }}
      runners: ${{ needs.prepare.outputs.runners }}
      runner_provider: ${{ needs.prepare.outputs.runner_provider }}
      save_cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}
      images: ${{ needs.prepare.outputs.images }}

 tidy-check:
    name: Tidy Check
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'tidy-check') }}
    needs: prepare
    runs-on: ${{ needs.prepare.outputs.runner_linux_x64 }}
    container:
      image: ${{ fromJson(needs.prepare.outputs.images).ubuntu_24_04_amd64_lint }}
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}

    steps:
    - name: "Checkout"
      uses: duckdb/duckdb-ci/.github/actions/checkout@main
      with:
        runner_provider: ${{ needs.prepare.outputs.runner_provider }}
        fetch_depth: ${{ github.event_name == 'workflow_dispatch' && '0' || '1' }}
        ref: ${{ needs.prepare.outputs.duckdb_commit }}

    - name: Tidy Check (clangd)
      run: |
        mkdir -p ~/.config/clangd
        cat > ~/.config/clangd/config.yaml <<'EOF'
        Diagnostics:
          UnusedIncludes: None
        EOF
        make tidy-check-clangd

    - name: Upload clangd-tidy logs
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: clangd-tidy-logs
        path: build/tidy/clangd-tidy-logs
        if-no-files-found: ignore

 extensions-build:
    name: Build extensions
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      contains(fromJson(needs.prepare.outputs.enabled_jobs), 'extensions-build') &&
      needs.linux-relassert.result == 'success' &&
      needs.linux-release.result == 'success' &&
      needs.linux-release-musl.result == 'success' &&
      needs.windows.result == 'success' &&
      (needs.osx.result == 'success' || needs.osx.result == 'skipped')
    uses: duckdb/extension-ci-tools/.github/workflows/build.yml@main
    needs:
      - prepare
      - linux-relassert
      - linux-release
      - linux-release-musl
      - windows
      - osx
    with:
      duckdb_version: ${{ needs.prepare.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.prepare.outputs.duckdb_commit }}
      image_version: ${{ needs.prepare.outputs.image_version }}
      groups: |
        core:
          config: duckdb/.github/config/core.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ needs.prepare.outputs.extension_opt_in_archs }}'
          toolchain: main
        cloud:
          config: duckdb/.github/config/cloud.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ needs.prepare.outputs.extension_opt_in_archs }}'
          toolchain: main
        search:
          config: duckdb/.github/config/search.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ needs.prepare.outputs.extension_opt_in_archs }}'
          toolchain: main
        scanner:
          config: duckdb/.github/config/scanner.cmake
          extra_toolchains: unixodbc;parser_tools
          opt_in_archs: '${{ needs.prepare.outputs.extension_opt_in_archs }}'
          toolchain: main
        rust:
          config: duckdb/.github/config/rust_based_extensions.cmake
          default_exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
          toolchain: rust
        external:
          config: duckdb/.github/config/external_extensions.cmake
          default_exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl
          toolchain: rust
      extension_repository: duckdb/extension-template
      extension_ref: main
      ci_tools_repository: duckdb/extension-ci-tools
      ci_tools_version: main
      exclude_archs: ${{ needs.prepare.outputs.extensions_extra_exclude_archs }}
      allow_failure_archs: ${{ needs.prepare.outputs.extension_allow_failure_archs }}
      vcpkg_commit: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # Release 2026.06.24
      windows_vcpkg_toolchain: cl
      reduced_ci_mode: ${{ needs.prepare.outputs.reduced_ci_mode }}
      skip_tests: ${{ fromJson(needs.prepare.outputs.skip_tests) }}
      save_cache: ${{ fromJson(needs.prepare.outputs.save_cache) }}
      runners: ${{ needs.prepare.outputs.runners }}
      prebuilt_source: workflow

 extensions-deploy:
    name: Deploy extensions
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.extensions-build.result == 'success' &&
      contains(fromJson(needs.prepare.outputs.enabled_jobs), 'extensions-deploy')
    runs-on: ${{ fromJSON(needs.prepare.outputs.runners).linux_x64 || 'ubuntu-latest' }}
    container:
      image: ghcr.io/duckdb/duckdb-ci/manylinux_2_28_amd64_main:${{ needs.prepare.outputs.image_version }}
    needs:
      - prepare
      - extensions-build
    env:
      DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
      DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
    steps:
      - name: "Checkout"
        uses: duckdb/duckdb-ci/.github/actions/checkout@main
        with:
          runner_provider: ${{ needs.prepare.outputs.runner_provider }}
          fetch_depth: 0
          ref: ${{ needs.prepare.outputs.duckdb_commit }}

      - uses: ./.github/actions/ccache-action

      - uses: actions/download-artifact@v8
        name: Download all extensions
        with:
          pattern: '*-extensions-*'
          path: /tmp/repository_generation
          # When multiple artifacts are matched:
          # - if true: the downloaded artifacts will be in the same directory
          #   specified by path.
          # - if false: the downloaded artifacts will be extracted into
          #   individual named directories within the specified path.
          #
          # Note: When downloading a single artifact (by name or ID), it will
          # always be extracted directly to the specified path.
          merge-multiple: true

      - name: Print all extensions
        run: |
          tree /tmp/repository_generation

          ls /tmp/repository_generation/*/*/*.duckdb_extension*

      - name: Validate extension signing
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          AWS_ENDPOINT_URL: https://example.com
          AWS_ACCESS_KEY_ID: duckdb-signing-validation
          AWS_SECRET_ACCESS_KEY: duckdb-signing-validation
          DUCKDB_EXTENSION_SIGNING_OUTPUT_DIR: /tmp/repository_signed_validation
        run: |
          set -euo pipefail

          private_key_file=$(mktemp "${TMPDIR:-/tmp}/duckdb-extension-signing-validation.XXXXXX.pem")
          public_key_file=$(mktemp "${TMPDIR:-/tmp}/duckdb-extension-signing-validation.XXXXXX.pub")
          trap 'rm -f "$private_key_file" "$public_key_file"' EXIT

          openssl genrsa -out "$private_key_file" 2048
          openssl rsa -in "$private_key_file" -pubout -out "$public_key_file"
          DUCKDB_EXTENSION_SIGNING_PK="$(cat "$private_key_file")"
          export DUCKDB_EXTENSION_SIGNING_PK

          rm -rf /tmp/repository_signed_validation
          make upload-extensions EXTENSION_REPOSITORY_PATH=/tmp/repository_generation
          make verify-extension-signing \
            SIGNED_EXTENSIONS_DIR=/tmp/repository_signed_validation \
            EXTENSION_SIGNING_PUBLIC_KEY_FILE="$public_key_file"

      - name: Deploy extensions
        shell: bash
        env:
          AWS_ENDPOINT_URL: ${{ secrets.DUCKDB_CORE_EXTENSION_S3_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{secrets.DUCKDB_CORE_EXTENSION_S3_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.DUCKDB_CORE_EXTENSION_S3_SECRET}}
          DUCKDB_DEPLOY_SCRIPT_MODE: for_real
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.DUCKDB_EXTENSION_SIGNING_PK }}
        run: |
          make upload-extensions EXTENSION_REPOSITORY_PATH=/tmp/repository_generation

      - name: Build DuckDB
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        uses: duckdb/duckdb-ci/build-duckdb@main
        env:
          GEN: ninja
          EXTENSION_CONFIGS: './.github/config/rust_based_extensions.cmake;./.github/config/out_of_tree_extensions.cmake;./.github/config/in_tree_extensions.cmake'
          EXTENSION_TESTS_ONLY: 1
          DUCKDB_CAPABILITIES: 'httplib loadable_extensions'
          DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
        with:
          build-type: release
          build: python3 scripts/ci/retry.py -- make release

      - name: Run Tests
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        env:
          LOCAL_EXTENSION_REPO: /tmp/repository_generation
          DUCKDB_TEST_DESCRIPTION: 'Running with autoloading of extensions. Run unittest --autoloading available to reproduce locally. Add require no_extension_autoloading to skip the test'
        run: make unittest_release SKIP_BUILD=1 T="--test-flags='--autoloading available --skip-compiled'"

      - name: Build other repository
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        env:
          GENERATE_EXTENSION_ENTRIES: 1
          LOCAL_EXTENSION_REPO: build/release/repository_other
          DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
        run: |
          python3 scripts/ci/retry.py -- make release

      - name: Copy over local extension repository
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: |
          cp -r /tmp/repository_generation build/release/repository
          tree build/release/repository
          find build/release/repository -type f ! -path "build/release/repository/*/linux_amd64/*" -delete
          tree build/release/repository

      # Disable downloading release because extension_entries.hpp check fails
      # in CI because some extensions are not available.
      - name: Download linux release artifact
        if: ${{ false && !fromJson(needs.prepare.outputs.skip_tests) }}
        id: linux_release_artifact
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: linux-release-build.tar.gz
          path: build

      - name: Extract linux release artifact
        if: ${{ steps.linux_release_artifact.outcome == 'success' }}
        run: |
          rm -rf build/release
          tar -xzf build/linux-release-build.tar.gz -C build

      - name: Install parser tools
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        run: python3 scripts/ci/retry.py -- pip3 install --break-system-packages cxxheaderparser==2.0.0 pcpp==1.30 typos==1.45.1

      - name: Check if extension_entries.hpp is up to date
        if: ${{ !fromJson(needs.prepare.outputs.skip_tests) }}
        id: check_extension_entries
        env:
          EXTENSION_CONFIGS: '.github/config/in_tree_extensions.cmake;.github/config/out_of_tree_extensions.cmake'
          DUCKDB_VERSION: ${{ needs.prepare.outputs.duckdb_version }}
          DUCKDB_COMMIT: ${{ needs.prepare.outputs.duckdb_commit }}
        run: |
          make check-extension-entries

      - name: Upload extension entries diff
        if: ${{ always() && steps.check_extension_entries.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: extension-entries-diff
          path: extension_entries.hpp.diff
          if-no-files-found: error

 wasm-eh:
    name: Wasm EH
    if: ${{ contains(fromJson(needs.prepare.outputs.enabled_jobs), 'wasm-eh') }}
    needs:
